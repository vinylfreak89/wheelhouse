<!doctype html>
<meta charset="utf-8">
<title>Wheelhouse</title>
<style>
:root{
  --bg:#141418; --panel:#191920; --panel2:#20202a; --panel3:#262633;
  --line:#2c2c38; --fg:#e8e8f0; --dim:#8f8fa3; --dim2:#6a6a7d;
  --accent:#7aa2f7; --accent2:#9ece6a; --user:#26365c;
  --ok:#9ece6a; --warn:#e0af68; --err:#f7768e; --run:#7dcfff;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{display:flex;background:var(--bg);color:var(--fg);
     font:13.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#33333f;border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#44445a;background-clip:padding-box}

/* ---------- sidebar ---------- */
#side{width:252px;flex:0 0 252px;background:var(--panel);border-right:1px solid var(--line);
      display:flex;flex-direction:column;min-height:0}
#brand{padding:14px 14px 10px;display:flex;align-items:center;gap:8px;-webkit-app-region:drag}
#dot{width:7px;height:7px;border-radius:50%;background:var(--err);transition:background .3s}
#dot.on{background:var(--ok)}
#brand h1{font-size:12px;margin:0;font-weight:700;letter-spacing:.12em;color:var(--dim)}
#newbtn{margin:0 10px 10px;padding:8px;border:1px solid var(--line);background:var(--panel2);
        color:var(--fg);border-radius:7px;cursor:pointer;font-size:13px;transition:.15s}
#newbtn:hover{border-color:var(--accent);background:var(--panel3)}
#tabs{display:flex;gap:2px;padding:0 10px 8px}
.tab{flex:1;padding:5px 3px;font-size:10.5px;text-align:center;border-radius:6px;cursor:pointer;
     color:var(--dim2);border:1px solid transparent;user-select:none}
.tab:hover{color:var(--fg)}
.tab.on{background:var(--panel2);color:var(--fg);border-color:var(--line)}
.tab .n{opacity:.55;margin-left:3px}
#list{flex:1;overflow-y:auto;padding:0 8px 10px;min-height:0}
.grp{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim2);
     padding:10px 6px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th{padding:7px 9px;border-radius:6px;cursor:pointer;margin-bottom:2px;font-size:13px;
    color:var(--dim);display:flex;align-items:center;gap:7px}
.th:hover{background:var(--panel2);color:var(--fg)}
.th.sel{background:var(--panel3);color:var(--fg);box-shadow:inset 2px 0 0 var(--accent)}
.th .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .acts{display:none;gap:2px}
.th:hover .acts{display:flex}
.th .acts button{background:none;border:0;color:var(--dim2);cursor:pointer;padding:0 3px;
  font-size:12px;line-height:1;border-radius:4px}
.th .acts button:hover{color:var(--fg);background:var(--panel3)}
.th .acts button.del:hover{color:var(--err)}
.st{width:6px;height:6px;border-radius:50%;flex:0 0 6px;background:var(--dim2)}
.st.running{background:var(--run);animation:pulse 1.1s infinite}
.st.idle{background:var(--ok);opacity:.55}
.st.errdot{background:var(--err)}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
#empty{color:var(--dim2);font-size:12px;padding:16px 10px;line-height:1.6}
#approvals{flex:0 0 auto;padding:0 14px}
#approvals:empty{display:none}
#approvals .appr{border:1px solid var(--warn);border-radius:8px;margin:8px 0}
#hint{flex:0 0 auto;min-height:0;padding:0 12px 7px;color:var(--dim2);
      font-size:10.5px;line-height:1.4}
#hint:empty{display:none}
#usage{flex:0 0 auto;border-top:1px solid var(--line);padding:9px 12px 11px;font-size:11px;color:var(--dim2)}
#usage .u{margin-bottom:6px}
#usage .u:last-child{margin-bottom:0}
#usage .lbl{display:flex;justify-content:space-between;margin-bottom:3px}
#usage .lbl b{color:var(--dim);font-weight:600}
#usage .track{height:3px;background:var(--panel3);border-radius:2px;overflow:hidden}
#usage .fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
#usage .fill.warn{background:var(--warn)} #usage .fill.hot{background:var(--err)}
#usage .bucket+.bucket{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
#usage .bucket-title{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;
  color:var(--fg);font-weight:600}
#usage .bucket-title span{color:var(--dim2);font-weight:400;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#usage .plan{display:flex;justify-content:space-between;color:var(--dim2);margin-top:7px}
#usage .cred{display:flex;justify-content:space-between;margin-top:7px;
  padding-top:7px;border-top:1px solid var(--line)}
#usage .cred b{color:var(--dim);font-weight:600}
#usage .cred span{color:var(--accent2);font-weight:600}
#usage .cred.covering span{color:var(--warn)}
#usage .note{color:var(--dim2);margin-top:4px;font-size:10.5px}

/* ---------- find ---------- */
#findbar{display:none;position:fixed;z-index:30;top:50px;right:18px;align-items:center;
  gap:5px;padding:7px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 8px 28px #0008}
#findbar.on{display:flex}
#findbar input{width:260px;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;color:var(--fg);font:12px var(--mono);padding:6px 8px;outline:none}
#findbar input:focus{border-color:var(--accent)}
#findbar input.miss{border-color:var(--err)}
#findbar button{width:27px;height:27px;padding:0;border:1px solid var(--line);
  border-radius:6px;background:var(--panel);color:var(--dim);cursor:pointer}
#findbar button:hover{border-color:var(--accent);color:var(--fg)}
#findstatus{min-width:62px;color:var(--dim2);font-size:10.5px;text-align:right}
#findprogress{position:absolute;left:7px;right:7px;bottom:2px;height:2px;
  background:transparent;overflow:hidden;border-radius:2px}
#findprogress i{display:block;width:0;height:100%;background:var(--accent);
  transition:width .08s linear}
#findbar.searching #findprogress{background:var(--panel3)}

/* ---------- main ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#bar{padding:0 14px;height:44px;flex:0 0 44px;border-bottom:1px solid var(--line);
     display:flex;gap:10px;align-items:center;font-size:12px;color:var(--dim);
     -webkit-app-region:drag}
#bar b{color:var(--fg);font-weight:600;font-size:13px;max-width:340px;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar .sp{flex:1}
.chip{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--panel2);
      border:1px solid var(--line);color:var(--dim);-webkit-app-region:no-drag}
.iconbtn{-webkit-app-region:no-drag;background:none;border:1px solid var(--line);color:var(--dim);
         border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px}
.iconbtn:hover{color:var(--fg);border-color:var(--accent)}
.iconbtn.on{color:var(--accent);border-color:var(--accent)}
#log{flex:1;overflow-y:auto;overflow-anchor:none;padding:20px 22px;min-height:0}
#history,#live{display:contents}
#live[hidden]{display:none}
.msg{margin-bottom:15px;max-width:840px}
.msg.search-target{outline:1px solid color-mix(in srgb,var(--accent) 55%,transparent);
  outline-offset:6px;border-radius:3px}
.msg.pending{display:none}
.history-boundary{display:block;margin:4px auto 15px;padding:5px 10px;border:1px solid var(--line);
  border-radius:999px;background:var(--panel);color:var(--dim2);font-size:10.5px;cursor:pointer}
.history-boundary:hover{color:var(--fg);border-color:var(--accent)}
.who{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim2);
     margin-bottom:4px;display:flex;gap:7px;align-items:baseline}
.who .ts{text-transform:none;letter-spacing:0;opacity:.55;font-variant-numeric:tabular-nums}
.body{white-space:pre-wrap;word-wrap:break-word}
.body.md{white-space:normal}
.body.md>:first-child{margin-top:0} .body.md>:last-child{margin-bottom:0}
.body.md p{margin:0 0 8px}
.body.md h1,.body.md h2,.body.md h3,.body.md h4{margin:13px 0 6px;font-weight:650;color:var(--fg)}
.body.md h1{font-size:15px} .body.md h2{font-size:14px}
.body.md h3,.body.md h4{font-size:13px}
.body.md ul,.body.md ol{margin:0 0 8px;padding-left:20px}
.body.md li{margin:2px 0}
.body.md code{font-family:var(--mono);font-size:11.5px;background:var(--panel);
  border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.body.md pre{margin:0 0 8px;padding:8px 10px;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;overflow-x:auto}
.body.md pre code{background:none;border:0;padding:0;font-size:11.5px}
.body.md blockquote{margin:0 0 8px;padding-left:10px;border-left:2px solid var(--line);color:var(--dim)}
.body.md table{border-collapse:collapse;margin:0 0 8px;font-size:12px;display:block;
  overflow-x:auto;max-width:100%}
.body.md th,.body.md td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.body.md th{color:var(--dim);font-weight:600}
.body.md a{color:var(--accent)}
.body.md hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.body.md strong{color:var(--fg);font-weight:650}
.msg.user .body{background:var(--user);padding:9px 12px;border-radius:9px;display:inline-block;max-width:100%}
.msg.tool .body,.msg.cmd .body{font-family:var(--mono);font-size:11.5px;background:var(--panel);
    border:1px solid var(--line);padding:8px 10px;border-radius:6px;color:var(--dim);
    max-height:280px;overflow:auto}
.msg.err .body{color:var(--err);font-family:var(--mono);font-size:12px}
.msg.scaffold .body{color:var(--dim2);font-size:11.5px;font-family:var(--mono);
    max-height:22px;overflow:hidden;cursor:pointer;opacity:.6}
.msg.scaffold.open .body{max-height:none;opacity:1}
.msg.rsn .body{color:var(--dim2);font-style:italic;font-size:12.5px;
    border-left:2px solid var(--line);padding-left:10px}
.appr{border:1px solid var(--warn);border-radius:8px;padding:11px 13px;background:#201d16;margin-bottom:15px}
.appr .t{color:var(--warn);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.appr pre{font-family:var(--mono);font-size:11.5px;margin:0 0 9px;white-space:pre-wrap;
    max-height:190px;overflow:auto;color:var(--fg)}
.appr button{margin-right:7px;padding:5px 13px;border-radius:6px;border:1px solid var(--line);
    cursor:pointer;background:var(--panel2);color:var(--fg)}
.appr button.yes{background:var(--accent2);color:#14140f;border-color:var(--accent2);font-weight:600}
.appr button.no{background:var(--err);color:#fff;border-color:var(--err)}
.appr .q{margin:9px 0;padding-top:8px;border-top:1px solid var(--line)}
.appr .q label{display:block;color:var(--fg);font-size:12px;margin-bottom:5px}
.appr .q small{display:block;color:var(--dim);margin-bottom:5px}
.appr .q input,.appr .q select,.appr .q textarea{width:100%;background:var(--panel2);
  color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.appr .q input[type="checkbox"]{width:auto;margin-right:6px}
.appr .q textarea{min-height:85px;resize:vertical;font-family:var(--mono);font-size:11.5px}
.appr .prompt-error{color:var(--err);font-size:11.5px;margin-top:7px}
.appr a{color:var(--accent);word-break:break-all}

/* ---------- composer ---------- */
#foot{flex:0 0 auto;border-top:1px solid var(--line);padding:11px 14px;background:var(--panel)}
#row{display:flex;gap:8px;align-items:flex-end}
#inp{flex:1;resize:none;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
     border-radius:9px;padding:10px 12px;font:inherit;max-height:200px;min-height:42px}
#inp:focus{outline:none;border-color:var(--accent)}
.act{padding:10px 15px;border-radius:9px;border:1px solid var(--line);background:var(--accent);
     color:#12121a;font-weight:600;cursor:pointer}
.act:disabled{opacity:.4;cursor:default}
#stop{background:var(--err);color:#fff;border-color:var(--err);display:none}
#ctl{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
select.mini{background:var(--panel2);color:var(--dim);border:1px solid var(--line);
    border-radius:6px;padding:3px 6px;font-size:11px}
select.mini:focus{outline:none;border-color:var(--accent)}

/* ---------- protocol pane ---------- */
#apane{width:390px;flex:0 0 390px;background:var(--panel);border-left:1px solid var(--line);
       display:none;flex-direction:column;min-height:0}
#apane.on{display:flex}
#apane header{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:7px;font-size:11px;color:var(--dim)}
#apane header .sp{flex:1}
#apane header #aTitle{color:var(--fg);font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;max-width:170px}
#alog{flex:1;overflow-y:auto;padding:12px;min-height:0}
#alog .msg{margin-bottom:11px;max-width:none}
#alog .msg .body{font-size:12.5px}
#wire{width:360px;flex:0 0 360px;background:var(--panel);border-left:1px solid var(--line);
      display:none;flex-direction:column;min-height:0}
#wire.on{display:flex}
#wire header{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;gap:8px;font-size:11px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--dim2)}
#wire header .sp{flex:1}
#wlog{flex:1;overflow-y:auto;padding:8px;font-family:var(--mono);font-size:10.5px;min-height:0}
.w{margin-bottom:5px;border-left:2px solid var(--line);padding-left:7px}
.w.out{border-color:var(--accent)}
.w.in{border-color:var(--accent2)}
.w.note{border-color:var(--dim2)}
.w.werr{border-color:var(--err)}
.w .h{color:var(--dim);margin-bottom:1px}
.w .h .m{color:var(--fg)}
.w .p{color:var(--dim2);white-space:pre-wrap;word-break:break-all;max-height:80px;overflow:hidden}
.w.open .p{max-height:none}

/* ---------- modal ---------- */
#mask{position:fixed;inset:0;background:#000a;display:none;align-items:center;
      justify-content:center;z-index:50}
#mask.on{display:flex}
#modal{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
       padding:20px;width:520px;max-width:92vw;box-shadow:0 18px 50px #000b}
#modal h2{margin:0 0 14px;font-size:15px}
.f{margin-bottom:11px}
.f label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
.f input,.f select{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:8px 10px;font:inherit}
.f input:focus,.f select:focus{outline:none;border-color:var(--accent)}
.two{display:flex;gap:10px}.two>*{flex:1}
#mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#mbtns button{padding:8px 16px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--fg);cursor:pointer}
#mbtns button.pri{background:var(--accent);color:#12121a;border-color:var(--accent);font-weight:600}
#merr{color:var(--err);font-size:12px;margin-top:8px;display:none}
</style>

<div id="side">
  <div id="brand"><span id="dot"></span><h1>CODEX</h1></div>
  <button id="newbtn">+ New thread</button>
  <div id="tabs">
    <div class="tab on" data-t="projects">Projects<span class="n" id="nP"></span></div>
    <div class="tab" data-t="running">Running<span class="n" id="nR"></span></div>
    <div class="tab" data-t="done">Done<span class="n" id="nD"></span></div>
    <div class="tab" data-t="agents">Agents<span class="n" id="nA"></span></div>
  </div>
  <div id="list"></div>
  <div id="hint" role="status" aria-live="polite"></div>
  <div id="usage"></div>
</div>

<div id="main">
  <div id="bar">
    <b id="title">No thread</b>
    <span class="chip" id="cModel" style="display:none"></span>
    <span class="chip" id="cEff" style="display:none"></span>
    <button class="chip" id="cAppr" style="display:none" title="Change approval routing"></button>
    <span class="chip" id="cSbx" style="display:none"></span>
    <button class="chip" id="cCwd" style="display:none" title="Change working directory"></button>
    <span class="chip" id="cTok" style="display:none"></span>
    <span class="sp"></span>
    <button class="iconbtn" id="wireBtn">protocol</button>
  </div>
  <div id="approvals"></div>
  <div id="log"><div id="history"></div><div id="live"></div></div>
  <div id="foot">
    <div id="row">
      <textarea id="inp" placeholder="Message Codex…   Enter to send · Shift+Enter for a newline" disabled></textarea>
      <button class="act" id="send" disabled>Send</button>
      <button class="act" id="stop">Stop</button>
    </div>
    <div id="ctl">
      <select class="mini" id="selModel" title="model for the next turn"></select>
      <select class="mini" id="selEffort" title="reasoning effort"></select>
      <select class="mini" id="selTier" title="service tier"></select>
      <select class="mini" id="selAppr" title="approval policy for this turn">
        <option value="">approvals: thread default</option>
        <option value="auto-review">auto-review</option>
        <option value="never">never</option>
        <option value="on-request">on-request</option>
        <option value="untrusted">untrusted</option>
      </select>
    </div>
  </div>
</div>

<div id="apane">
  <header>
    <span id="aTitle">agent</span>
    <span class="sp"></span>
    <button class="iconbtn" id="aOpen" title="open as the main thread">promote</button>
    <button class="iconbtn" id="aClose">close</button>
  </header>
  <div id="alog"></div>
</div>

<div id="wire">
  <header>protocol<span class="sp"></span>
    <button class="iconbtn" id="wclear">clear</button>
    <button class="iconbtn" id="wpause">pause</button>
  </header>
  <div id="wlog"></div>
</div>

<div id="findbar" role="search" aria-label="Find in conversation">
  <input id="findinp" type="search" autocomplete="off" spellcheck="false"
         aria-label="Find text">
  <span id="findstatus" role="status"></span>
  <button id="findprev" title="Previous match (Shift-Command-G)">↑</button>
  <button id="findnext" title="Next match (Command-G)">↓</button>
  <button id="findclose" title="Close (Escape)">×</button>
  <span id="findprogress" aria-hidden="true"><i></i></span>
</div>

<div id="mask"><div id="modal">
  <h2>New thread</h2>
  <div class="f"><label>Name</label><input id="mName" placeholder="[project] what this is for"></div>
  <div class="f"><label>Working directory</label><input id="mCwd"></div>
  <div class="two">
    <div class="f"><label>Model</label><select id="mModel"></select></div>
    <div class="f"><label>Reasoning effort</label><select id="mEffort"></select></div>
  </div>
  <div class="two">
    <div class="f"><label>Sandbox</label><select id="mSbx">
      <option value="workspace-write">workspace-write</option>
      <option value="read-only">read-only</option>
      <option value="danger-full-access">danger-full-access</option></select></div>
    <div class="f"><label>Approvals</label><select id="mAppr">
      <option value="never">never (auto)</option>
      <option value="auto-review">auto-review</option>
      <option value="on-request">on-request</option>
      <option value="untrusted">untrusted</option></select></div>
  </div>
  <div id="merr"></div>
  <div id="mbtns"><button id="mCancel">Cancel</button><button class="pri" id="mCreate">Create</button></div>
</div></div>

<script>
/* WHEELHOUSE_UI_CONTRACTS_START
   Pure request builders live in the page so the UI and its tests exercise the
   same code. Keep this block free of DOM access: tests evaluate it in Node. */
const UIContracts=Object.freeze({
  serverRequests:Object.freeze({
    "execCommandApproval":"legacyApproval",
    "applyPatchApproval":"legacyApproval",
    "item/commandExecution/requestApproval":"approval",
    "item/fileChange/requestApproval":"approval",
    "item/permissions/requestApproval":"permissions",
    "item/tool/requestUserInput":"userInput",
    "mcpServer/elicitation/request":"elicitation",
    "currentTime/read":"currentTime",
    "account/chatgptAuthTokens/refresh":"unsupported",
    "attestation/generate":"unsupported",
    "item/tool/call":"unsupported"
  }),
  approvalVocab(method){
    const kind=this.serverRequests[method];
    if(kind==="legacyApproval")
      return {yes:"approved",always:"approved_for_session",no:"abort"};
    if(kind==="approval")
      return {yes:"accept",always:"acceptForSession",no:"decline"};
    return null;
  },
  permissionResponse(params,grant,scope="turn"){
    return {permissions:grant?((params&&params.permissions)||{}):{},
            scope,strictAutoReview:!grant};
  },
  userInputResponse(entries){
    const answers={};
    for(const [id,values] of entries) answers[id]={answers:values};
    return {answers};
  },
  elicitationResponse(action,content){
    const out={action};
    if(action==="accept"&&content!==undefined) out.content=content;
    return out;
  },
  currentTimeResponse(nowMs=Date.now()){
    return {currentTimeAt:Math.floor(nowMs/1000)};
  },
  unsupportedRequestError(method){

  optimisticEchoesMissingFromTranscript(entries,{threadId,rows}){

/* ---------- find ---------- */
let findController=null, findGeneration=0, findTimer=0;
let findQuery="", findRowId="", findProgress=0;
function nativeFind(query,backwards=false){
  const handler=window.webkit&&window.webkit.messageHandlers&&
    window.webkit.messageHandlers.find;
  if(handler) handler.postMessage({query,backwards});
  else if(query) window.updateFindResult(window.find(query,false,backwards,true));
}
function setFindProgress(percent,{active=true}={}){
  findProgress=active?UIContracts.monotonicProgress(findProgress,percent):0;
  $("#findbar").classList.toggle("searching",active);
  $("#findprogress i").style.width=`${findProgress}%`;
}
async function requestFind(backwards=false){
  clearTimeout(findTimer);
  const query=$("#findinp").value;
  if(findController) findController.abort();
  const generation=++findGeneration;
  if(!query){
    findQuery=""; findRowId=""; setFindProgress(0,{active:false});
    $("#findstatus").textContent="type to find"; nativeFind(""); return;
  }
  const sameQuery=query===findQuery;
  const anchor=sameQuery?findRowId:"";
  findQuery=query; findProgress=0; setFindProgress(0);
  $("#findstatus").textContent="searching…";
  $("#findinp").classList.remove("miss");
  findController=new AbortController();
  const params=new URLSearchParams({id:cur||"",q:query,
    direction:backwards?"backward":"forward"});
  if(anchor) params.set("anchor",anchor);
  try{
    const response=await fetch("/transcript/search?"+params,
      {signal:findController.signal});
    if(!response.ok||!response.body) throw new Error(`search failed (${response.status})`);
    const reader=response.body.getReader(), decoder=new TextDecoder();
    let buffer="", matched=false;
    while(true){
      const chunk=await reader.read();
      const decoded=decoder.decode(chunk.value||new Uint8Array(),{stream:!chunk.done});
      const parsed=UIContracts.ndjsonChunk(buffer,decoded,chunk.done);
      buffer=parsed.rest;
      for(const event of parsed.events){
        if(generation!==findGeneration) return;
        if(event.type==="progress"){
          setFindProgress(event.percent);
          $("#findstatus").textContent=`${Math.floor(findProgress)}%`;
        }else if(event.type==="match"){
          matched=true; findRowId=event.rowId;
          installTranscriptPage(event.page,
            {direction:"reset",focusRow:event.rowId,preserveLive:true});
        }else if(event.type==="error") throw new Error(event.error);
      }
      if(chunk.done) break;
    }
    if(generation!==findGeneration) return;
    setFindProgress(100,{active:false});
    $("#findinp").classList.toggle("miss",!matched);
    $("#findstatus").textContent=matched?"match":"no matches";
    if(matched) nativeFind(query,backwards); else nativeFind("");
  }catch(error){
    if(error.name==="AbortError") return;
    if(generation!==findGeneration) return;
    setFindProgress(0,{active:false});
    $("#findinp").classList.add("miss");
    $("#findstatus").textContent="search error";
  }finally{
    if(generation===findGeneration) findController=null;
  }
}
window.openFind=()=>{
  const bar=$("#findbar"), input=$("#findinp");
  bar.classList.add("on");
  const selected=String(window.getSelection&&window.getSelection()||"").trim();
  if(selected&&!input.value) input.value=selected;
  input.focus(); input.select();

window.findNext=backwards=>{

  $("#findstatus").textContent=hasQuery?(found?"match":"no matches"):"type to find";
};
function closeFind(){
  if(findController) findController.abort();
  findController=null; ++findGeneration; clearTimeout(findTimer);
  $("#findbar").classList.remove("on");

$("#findinp").oninput=()=>{

async function rpc(method,params,timeout){
  try{
    const r=await fetch("/rpc",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({method,params,timeout})});
    return await r.json();
  }catch(e){ return {error:{message:String(e)}}; }
}
async function respond(id,result,error){
  const payload={id};
  if(error!==undefined) payload.error=error; else payload.result=result;
  const r=await fetch("/respond",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)});
  let body={}; try{ body=await r.json(); }catch(e){}
  if(!r.ok||body.error){
    const detail=(body.error&&body.error.message)||body.error||`response failed (${r.status})`;
    throw new Error(typeof detail==="string"?detail:JSON.stringify(detail));
  }
  return body;
}

/* The transcript is rendered from the rollout JSONL via /transcript.
   There is deliberately NO client-side cache: the earlier one duplicated,
   misordered and mis-stamped messages, and the rollout already holds
   everything it was trying to preserve. */

function fmtTs(ms){
  if(!ms) return "";
  return new Date(ms).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
/* ---------- markdown ----------
   Agent output is markdown; rendering it as literal text made tables and code
   fences unreadable. Deliberately small and dependency-free: escape FIRST, then
   build HTML from the escaped text, so nothing an agent emits can inject markup.
   Only http/https links are linkified. */
function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function mdInline(t){
  return t
    .replace(/`([^`]+)`/g, (_,c)=>`<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/(^|[\s(])_([^_\n]+)_/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
             '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}
function md(src){
  const lines = esc(String(src||"")).split("\n");
  const out=[]; let i=0;
  const isTableSep = l => /^\s*\|?[\s:-]*-[-\s:|]*\|?\s*$/.test(l) && l.includes("-");
  const cells = l => l.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*```/.test(l)){                                   // fenced code
      const buf=[]; i++;
      while(i<lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${buf.join("\n")}</code></pre>`); continue;
    }
    if(/^\s*(---+|\*\*\*+|___+)\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    const h=l.match(/^(#{1,4})\s+(.*)$/);
    if(h){ const n=h[1].length; out.push(`<h${n}>${mdInline(h[2])}</h${n}>`); i++; continue; }
    if(l.includes("|") && i+1<lines.length && isTableSep(lines[i+1])){
      const head=cells(l); i+=2; const rows=[];
      while(i<lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
      out.push(`<table><thead><tr>${head.map(c=>`<th>${mdInline(c)}</th>`).join("")}</tr></thead>`+
               `<tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if(/^\s*&gt;\s?/.test(l)){
      const buf=[];
      while(i<lines.length && /^\s*&gt;\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*&gt;\s?/,""));
      out.push(`<blockquote>${md(buf.join("\n").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'"))}</blockquote>`);
      continue;
    }
    if(/^\s*([-*+]|\d+\.)\s+/.test(l)){
      const ord=/^\s*\d+\./.test(l); const buf=[];
      while(i<lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i]))
        buf.push(lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/,""));
      out.push(`<${ord?"ol":"ul"}>${buf.map(x=>`<li>${mdInline(x)}</li>`).join("")}</${ord?"ol":"ul"}>`);
      continue;
    }
    if(!l.trim()){ i++; continue; }
    const buf=[];
    while(i<lines.length && lines[i].trim() && !/^\s*(```|#{1,4}\s|[-*+]\s|\d+\.\s|&gt;)/.test(lines[i])
          && !(lines[i].includes("|") && i+1<lines.length && isTableSep(lines[i+1])))
      buf.push(lines[i++]);
    out.push(`<p>${mdInline(buf.join("\n")).replace(/\n/g,"<br>")}</p>`);
  }
  return out.join("");
}
function renderMd(el){
  if(!el) return;
  const raw = el.dataset.raw ?? el.textContent;
  el.innerHTML = md(raw); el.classList.add("md");

function add(cls,who,text,ts){
  // ts is the message's REAL time, from the rollout. Live messages omit it
  // (=> now). NULL MEANS UNKNOWN -- render nothing rather than stamping "now",
  // which made every replayed message show the same clock.
  const when = (ts === null) ? null : (ts || Date.now());
  const stick=logTarget===liveEl&&atBottom();
  const d=document.createElement("div");
  d.className="msg "+cls;
  const w=document.createElement("div"); w.className="who";
  const wn=document.createElement("span"); wn.textContent=who;
  const wt=document.createElement("span"); wt.className="ts";
  wt.textContent = when ? fmtTs(when) : "";
  w.append(wn,wt);
  if(when) d.dataset.ts=String(when);
  const b=document.createElement("div"); b.className="body"; b.textContent=text||"";
  // Agent prose is markdown; command output and user text are not.
  if((cls==="agent"||cls==="rsn") && text){ b.dataset.raw=text; renderMd(b); }
  d.append(w,b); logTarget.append(d);
  if(stick) logEl.scrollTop=logEl.scrollHeight;
  // Cache ONLY what server history does not replay (commands / tool items).
  // Caching messages too meant every re-render added the server's copy AND the
  // cached copy -- messages doubled, then tripled as reconcile ran.
  return b;

      }
    }
    item.classList.toggle("pending",hidden&&!(body.dataset.raw||body.textContent));
    return body;
  };
  return item?UIContracts.mutatePreservingTail(logEl,mutate):mutate();
}
function renderItem(it,ts,{reserve=false,preserve=false}={}){
  const ty=String(it.type||it.itemType||"");
  if(/^user/i.test(ty)) return upsertItem(it,"user","you",
    textOf(it)||JSON.stringify(it).slice(0,600),ts);
  if(/agentMessage|agent_message/i.test(ty)){
    const ph=it.phase||"";   // commentary = thinking aloud, final_answer = the result
    const text=textOf(it);
    return upsertItem(it,ph==="commentary"?"rsn":"agent",
      ph==="commentary"?"codex \u00b7 thinking":"codex",text,ts,
      {hidden:(reserve||preserve)&&!text,preserve});
  }
  if(/reasoning/i.test(ty)){
    const text=textOf(it);
    return upsertItem(it,"rsn","thinking",text,ts,{hidden:!text,preserve});
  }
  if(/commandExecution|exec/i.test(ty)){
    const cmd=it.command||it.commandLine||(it.parsedCmd&&JSON.stringify(it.parsedCmd))||"";
    const out=it.aggregatedOutput||it.output||it.stdout||"";
    const st=it.status||it.exitCode;
    const text="$ "+String(cmd)+(out?"\n\n"+String(out).slice(0,6000):"");
    return upsertItem(it,"cmd",
      "command"+(st!==undefined&&st!==null?" \u00b7 "+st:""),text,ts,
      {hidden:reserve&&!cmd});
  }
  if(/fileChange|patch|applyPatch/i.test(ty)){
    const changes=it.changes||it.files||[];
    const text=changes.map?.(x=>x.path||x).join("\n")||
      (reserve?"":JSON.stringify(it).slice(0,900));
    return upsertItem(it,"tool","file change",text,ts,{hidden:reserve&&!text});
  }
  if(/webSearch/i.test(ty)){
    const q=it.query||it.q||(it.action&&it.action.query)||"";
    const n=(it.results||it.sources||[]).length;
    const text=q?(q+(n?`\n\n${n} result(s)`:"")):
      (reserve?"":JSON.stringify(it).slice(0,400));
    return upsertItem(it,"tool","web search",text,ts,{hidden:reserve&&!text});
  }
  if(/mcp|toolCall|dynamicTool/i.test(ty)){
    const nm=it.toolName||it.name||it.tool||"tool";
    const args=it.arguments||it.args||it.input;
    const text=args?(typeof args==="string"?args:JSON.stringify(args,null,1)).slice(0,1200):"";
    return upsertItem(it,"tool",String(nm),text,ts,{hidden:reserve&&!text});
  }
  if(/todo|plan/i.test(ty)){
    const items=(it.items||it.todos||[]);
    const text=items.map(x=>`${x.status==="completed"?"[x]":x.status==="inProgress"?"[~]":"[ ]"} ${x.text||x.title||x}`).join("\n");
    return upsertItem(it,"tool","plan",text,ts,{hidden:reserve&&!text});
  }
  if(/error/i.test(ty)) return upsertItem(it,"err",ty,
    textOf(it)||JSON.stringify(it).slice(0,600),ts);
  // unknown item type: show the type plainly, payload collapsed
  const text=reserve?"":JSON.stringify(it,null,1).slice(0,900);
  return upsertItem(it,"tool",ty||"item",text,ts,{hidden:reserve});
}

function appendItemDelta(itemId,{cls="agent",who="codex",delta=""}={}){
  if(!itemId) return null;

function clearTranscriptPane(){
  historyPages=[]; historyRows=[]; historyRange={start:0,end:0}; historyWarning="";
  liveErrorKeys.clear();

function renderHistoryRow(row,index){
  const ms=Date.parse(row.ts);
  let body;
  if(row.cls==="scaffold"){
    body=add("scaffold","injected: "+row.who,
      `(${row.text.length.toLocaleString()} chars — click to expand)`,

        `(${full.length.toLocaleString()} chars — click to expand)`; };

function historyBoundary(direction,count=null){
  const button=document.createElement("button");
  button.className="history-boundary";
  const amount=count===null?"load":count.toLocaleString();
  button.textContent=direction==="earlier"?`↑ ${amount} earlier entries`:
    `↓ ${amount} later entries`;
  button.onclick=()=>shiftHistory(direction);
  logTarget.append(button);
}

function hasEarlierHistory(){ return Boolean(historyPages[0]&&historyPages[0].hasEarlier); }
function hasLaterHistory(){
  return Boolean(historyPages.length&&historyPages[historyPages.length-1].hasLater);
}

function visibleHistoryAnchor(nextRange){
  const paneTop=logEl.getBoundingClientRect().top;
  return [...historyEl.querySelectorAll(".msg[data-history-index]")].find(node=>{
    const index=Number(node.dataset.historyIndex);
    return index>=nextRange.start&&index<nextRange.end&&
      node.getBoundingClientRect().bottom>paneTop;
  })||null;
}

function renderHistoryWindow(nextRange,{preserveAnchor=false}={}){
  nextRange={start:Math.max(0,nextRange.start),
             end:Math.min(historyRows.length,nextRange.end)};
  const anchor=preserveAnchor?visibleHistoryAnchor(nextRange):null;
  const anchorIndex=anchor&&anchor.dataset.historyIndex;
  const anchorTop=anchor&&anchor.getBoundingClientRect().top;
  const staging=document.createDocumentFragment();
  logTarget=staging; replaying=true;
  try{
    if(historyWarning&&nextRange.start===0)
      add("err","journal warning",historyWarning,null);
    if(nextRange.start>0) historyBoundary("earlier",nextRange.start);
    else if(hasEarlierHistory()) historyBoundary("earlier");
    historyRows.slice(nextRange.start,nextRange.end).forEach((row,offset)=>
      renderHistoryRow(row,nextRange.start+offset));
    if(nextRange.end<historyRows.length)
      historyBoundary("later",historyRows.length-nextRange.end);
    else if(hasLaterHistory()) historyBoundary("later");
  }finally{
    replaying=false; logTarget=liveEl;
  }
  historyEl.replaceChildren(staging);
  historyRange=nextRange;
  // The live tail is newer than every persisted transcript row. Hide it while
  // an older window is mounted so the view cannot visually jump across an
  // omitted middle section; it returns when scrolling reaches the real tail.
  liveEl.hidden=nextRange.end<historyRows.length||hasLaterHistory();
  if(anchorIndex!==null&&anchorIndex!==undefined){
    const replacement=historyEl.querySelector(`[data-history-index="${anchorIndex}"]`);
    if(replacement) logEl.scrollTop+=replacement.getBoundingClientRect().top-anchorTop;
  }
}

async function loadHistoryPage(direction){
  if(historyPageLoading||!cur||!historyPages.length) return;
  const edge=direction==="earlier"?historyPages[0]:historyPages[historyPages.length-1];
  const cursor=direction==="earlier"?edge.startCursor:edge.endCursor;
  if(!cursor) return;
  historyPageLoading=true;
  try{
    const response=await fetch(`/transcript?id=${encodeURIComponent(cur)}&${direction==="earlier"?"before":"after"}=${encodeURIComponent(cursor)}`);
    const page=await response.json();
    if(response.status===409||page.cursorInvalid){
      const fresh=await (await fetch("/transcript?id="+encodeURIComponent(cur))).json();
      installTranscriptPage(fresh,{direction:"reset"});
      return;
    }
    if(page.error) return;
    installTranscriptPage(page,{direction});
  }catch(error){}
  finally{ historyPageLoading=false; }
}

function shiftHistory(direction){
  if(!historyPages.length) return;
  const firstVisible=visibleHistoryAnchor(historyRange);
  const anchor=firstVisible?Number(firstVisible.dataset.historyIndex):null;
  const next=UIContracts.virtualRange({total:historyRows.length,
    start:historyRange.start,end:historyRange.end,direction,
    windowSize:HISTORY_WINDOW,chunkSize:HISTORY_CHUNK,anchor});
  if(next.start===historyRange.start&&next.end===historyRange.end){
    if((direction==="earlier"&&hasEarlierHistory())||
       (direction==="later"&&hasLaterHistory())) loadHistoryPage(direction);
    return;
  }
  renderHistoryWindow(next,{preserveAnchor:true});
}

logEl.addEventListener("scroll",()=>{
  if(historyShiftFrame) return;
  historyShiftFrame=requestAnimationFrame(()=>{
    historyShiftFrame=0;
    if(logEl.scrollTop<240&&(historyRange.start>0||hasEarlierHistory())) shiftHistory("earlier");
    else if(logEl.scrollHeight-logEl.scrollTop-logEl.clientHeight<240&&
            (historyRange.end<historyRows.length||hasLaterHistory())) shiftHistory("later");
  });
});

/* ---------- protocol pane ---------- */
/* Routine polling drowns the pane: thread/list alone fires every second and
   logs a large response each time, cycling the 400-entry buffer every few
   minutes. Mute housekeeping here only -- the calls still happen, they just
   stop hiding the traffic worth reading. Errors are never muted. */
const WIRE_MUTE=new Set(["thread/list","account/rateLimits/read","thread/read"]);
let wireShowAll=false;
function wire(dir,rpcName,id,payload,isErr){
  if(wirePaused) return;
  if(!wireShowAll && !isErr && WIRE_MUTE.has(rpcName)) return;
  const d=document.createElement("div");
  d.className="w "+(isErr?"werr":dir==="out"?"out":dir==="in"?"in":"note");
  const h=document.createElement("div"); h.className="h";
  const arrow=dir==="out"?"→":dir==="in"?"←":"·";
  h.innerHTML=`${arrow} <span class="m"></span> <span style="opacity:.5">${id??""}</span>`;
  h.querySelector(".m").textContent=rpcName||"";
  const p=document.createElement("div"); p.className="p"; p.textContent=payload||"";
  d.append(h,p);
  d.onclick=()=>d.classList.toggle("open");
  const pruneAtTail=UIContracts.nearTail(wlogEl,24);
  UIContracts.mutatePreservingTail(wlogEl,()=>{
    wlogEl.append(d);
    // Removing old rows from above a reader also moves their viewport. Defer
    // the 400-row trim until they return to the tail.
    if(pruneAtTail) while(wlogEl.children.length>400) wlogEl.firstChild.remove();
  },24);
}

/* ---------- thread list ---------- */
async function cwdOf(id){
  if(cwdCache[id]!==undefined) return cwdCache[id];
  const r=await rpc("thread/read",{threadId:id});
  const th=(r.result&&r.result.thread)||{};

  if(th.name) nameCache[id]=th.name;
  return cwdCache[id];
}
function showCwd(path){

async function changeThreadCwd(t){

    String(r.error.message||r.error).slice(0,180); return; }

  if(cur===t.id){ curInfo.cwd=payload.cwd; showCwd(payload.cwd); }

async function changeThreadAutonomy(t){

const nameCache={};
/* A thread's PROJECT is pinned by bin/codex-run and served from /projects.
   It is deliberately not threads.cwd: a turn's --cwd overwrites that column,
   which used to drag a conversation into whatever directory the work touched. */
let projReg={threads:{},roots:{}};
async function loadProjects(){
  try{ projReg=await (await fetch("/projects")).json()||{}; }catch(e){}
  projReg.threads??={}; projReg.roots??={};
  if(projReg.defaultCwd) DEFAULT_CWD=projReg.defaultCwd;
}
const base=p=>(p||"").replace(/\/+$/,"").split("/").pop()||"";
function projRootOf(id){ return (projReg.threads[id]||{}).root || ""; }
function projOf(id){
  const pin=projReg.threads[id];
  if(pin&&pin.name) return pin.name;
  return "(unassigned)";
}
const loadThreads=UIContracts.singleFlight(async()=>{
  const r=await rpc("thread/list",{limit:100});
  const nextThreads=r.result&&r.result.data;
  if(!Array.isArray(nextThreads)) return; // preserve the last good sidebar on a polling error
  await loadProjects();
  await Promise.all(nextThreads.slice(0,60).map(t=>cwdOf(t.id).catch(()=>"")));
  // thread/list is recency-ordered, so an active thread otherwise jumps around
  // the sidebar on every turn. Keep existing rows stable and prepend only
  // genuinely new threads.
  threads=UIContracts.stableById(threads,nextThreads);
  const running=threads.filter(t=>isActive(t)).length;
  $("#nR").textContent=running?` ${running}`:"";
  $("#nD").textContent=threads.length?` ${threads.length-running}`:"";
  const projs=new Set(threads.map(t=>projOf(t.id))); projs.delete("(unassigned)");
  $("#nP").textContent=projs.size?` ${projs.size}`:"";
  renderList();
});
const isActive=t=>((t.status||{}).type)==="active";
/* Sub-agent threads carry no name -- the useful identity is the nickname plus
   which agent definition ran (source.subagent.thread_spawn.agent_path). */
function agentLabel(a){
  return a.agentNickname || a.agentRole || (a.id||"").slice(0,8);
}
function agentKind(a){
  const src=a.source;
  let path="";
  try{
    const o=(typeof src==="string")?JSON.parse(src):src;
    // the API returns source.subAgent (camelCase); the DB column is subagent
    const sa=(o||{}).subAgent||(o||{}).subagent||{};
    path=(sa.thread_spawn||sa.threadSpawn||{}).agent_path||"";
  }catch(e){}
  if(!path && a.agentRole) return a.agentRole;
  return path ? path.split("/").filter(Boolean).pop() : "";
}
let agents=[];        // sub-agent threads spawned by the open thread

/* Codex sub-agents are SEPARATE THREADS linked by spawn edges, not inline tool
   calls. They are excluded from a default thread/list because sourceKinds
   defaults to interactive-only, so ask for them explicitly. */
const loadAgents=UIContracts.singleFlight(async()=>{
  const parent=cur;
  // Sub-agent threads are ONLY reachable via ancestorThreadId -- a plain
  // thread/list never returns them, whatever sourceKinds you pass. So with no
  // thread open, aggregate descendants across the threads we know about.
  let rows=[];
  if(parent){
    const r=await rpc("thread/list",{ancestorThreadId:parent,limit:50},40);
    if(!Array.isArray(r.result&&r.result.data)) return;
    rows=r.result.data;
    rows.forEach(x=>x.parentThreadId=x.parentThreadId||parent);
  } else {
    const parents=threads.slice(0,25);
    const res=await Promise.all(parents.map(pt=>
      rpc("thread/list",{ancestorThreadId:pt.id,limit:50},40)
        .then(r=>((r.result&&r.result.data)||[]).map(x=>{
          x.parentThreadId=x.parentThreadId||pt.id; return x; }))
        .catch(()=>[])));
    rows=res.flat();
  }
  if(cur!==parent) return;
  agents=UIContracts.stableById(agents,rows);
  $("#nA").textContent=agents.length?` ${agents.length}`:"";
  if(tab==="agents") renderList();
});
function label(t){ return t.name||nameCache[t.id]||t.preview||t.id.slice(0,8); }
let renderedListFingerprint="";
function listFingerprint(){
  return JSON.stringify({tab,cur,
    threads:threads.map(t=>[t.id,label(t),projOf(t.id),projRootOf(t.id),
      (t.status||{}).type,(t.status||{}).activeFlags||[]]),
    agents:agents.map(a=>[a.id,a.parentThreadId,agentLabel(a),agentKind(a)])});
}
function renderList(){
  const fingerprint=listFingerprint();
  if(fingerprint===renderedListFingerprint) return;
  renderedListFingerprint=fingerprint;
  listEl.innerHTML="";
  let rows=threads;
  if(tab==="running") rows=threads.filter(t=>isActive(t));
  if(tab==="done")    rows=threads.filter(t=>!isActive(t));
  if(tab==="agents"){
    if(agents.length){
      // group under the parent thread so provenance is obvious
      const byParent={};
      for(const a of agents){
        const k=a.parentThreadId||cur||"(unknown)";
        (byParent[k]??=[]).push(a);
      }
      for(const pid of Object.keys(byParent)){
        const pt=threads.find(x=>x.id===pid);
        const g=document.createElement("div"); g.className="grp";
        g.textContent="\u21b3 "+(pt?label(pt):(nameCache[pid]||pid.slice(0,8)));
        g.title=pid;
        g.style.cursor="pointer";
        g.onclick=()=>{ if(pt||pid) open_(pid); };
        listEl.append(g);
        for(const a of byParent[pid]){
          const d=row(a, agentLabel(a));
          d.onclick=()=>openAgent(a.id,agentLabel(a));
          const meta=document.createElement("span");
          meta.style.cssText="font-size:10px;color:var(--dim2);margin-left:4px;flex:0 0 auto";
          meta.textContent=agentKind(a);
          d.append(meta);
          listEl.append(d);
        }
      }
      return;
    }
    if(!agents.length){ const e=document.createElement("div"); e.id="empty";
      e.textContent=cur?"No sub-agents spawned by this thread."
                       :"No sub-agent threads.";
      listEl.append(e); return; }
    for(const a of agents){
      const d=row(a, agentLabel(a));
      d.onclick=()=>openAgent(a.id,agentLabel(a));
      const meta=document.createElement("span");
      meta.style.cssText="font-size:10px;color:var(--dim2);margin-left:4px;flex:0 0 auto";
      meta.textContent=agentKind(a);
      d.append(meta);
      listEl.append(d);
    }
    return;
  }
  if(!rows.length){
    const e=document.createElement("div"); e.id="empty";
    e.textContent=threads.length?"Nothing here.":"No threads yet — create one to start.";
    listEl.append(e); return;
  }
  if(tab==="projects"){
    const groups={};
    const roots={};
    for(const t of rows){ const k=projOf(t.id); (groups[k]??=[]).push(t); roots[k]??=projRootOf(t.id); }
    for(const k of Object.keys(groups).sort()){
      const g=document.createElement("div"); g.className="grp";
      g.textContent=k;                       /* the name, not the path */
      g.title=(roots[k]||"").replace(/^\/Users\/[^/]+\//,"~/");
      listEl.append(g);
      groups[k].forEach(t=>listEl.append(row(t)));
    }
  } else rows.forEach(t=>listEl.append(row(t)));
}
function row(t, labelOverride){
  const d=document.createElement("div");
  d.className="th"+(t.id===cur?" sel":"");
  const ty=(t.status||{}).type;
  const st=document.createElement("span");
  st.className="st "+(isActive(t)?"running":ty==="systemError"?"errdot":"idle");
  if(ty==="systemError") st.title="system error";
  const flags=((t.status||{}).activeFlags)||[];
  if(flags.length) st.title=flags.join(", ");
  const nm=document.createElement("span"); nm.className="nm";
  nm.textContent=labelOverride||label(t);
  const acts=document.createElement("span"); acts.className="acts";
  const mkAct=(sym,title,cls,fn)=>{
    const b=document.createElement("button");
    b.textContent=sym; b.title=title; if(cls) b.className=cls;
    b.onclick=async e=>{ e.stopPropagation(); await fn(); };
    acts.append(b);
  };
  mkAct("\u2913","Archive \u2014 tidies up, keeps the transcript",null,async()=>{
    // Sub-agents belong to their parent: archiving the parent must take them
    // with it, or they linger with no visible owner.
    const kidsR=await rpc("thread/list",{ancestorThreadId:t.id,limit:50},40);
    const kids=(kidsR.result||{}).data||kidsR.data||[];
    for(const k of kids) await rpc("thread/archive",{threadId:k.id});
    await rpc("thread/archive",{threadId:t.id});
    if(kids.length) $("#hint").textContent=`archived with ${kids.length} sub-agent(s)`;
    loadThreads(); loadAgents();
  });
  mkAct("\u00d7","Delete permanently \u2014 removes the transcript too","del",async()=>{
    // Sub-agent threads are persisted with their own rollouts; deleting only
    // the parent would orphan them. Take the whole tree.
    const kidsR=await rpc("thread/list",{ancestorThreadId:t.id,limit:50},40);
    const kids=(kidsR.result||{}).data||kidsR.data||[];
    const extra=kids.length?`\n\nThis also deletes ${kids.length} sub-agent thread(s).`:"";
    const ok=await askConfirm("Delete \u201c"+label(t)+"\u201d and its transcript?"+extra);
    if(!ok) return;
    for(const k of kids){
      await rpc("thread/delete",{threadId:k.id});
    }
    await rpc("thread/delete",{threadId:t.id});
    if(cur===t.id){ cur=null; threadViewReady=true; rememberThreadId("");
      clearTranscriptPane(); $("#title").textContent="No thread"; setBusy(false); }
    loadThreads(); loadAgents();
  });
  d.append(st,nm,acts); d.title=t.id;
  d.onclick=()=>open_(t.id);
  d.oncontextmenu=e=>{ e.preventDefault(); threadMenu(t,e.clientX,e.clientY); };
  return d;
}

/* ---------- model capabilities ----------
   Efforts, their default, and service tiers are advertised per model by
   model/list. Hardcoding a scale is wrong: gpt-5.6-sol defaults to "low" and
   supports up to "ultra", while gpt-5.4 tops out at "xhigh". */
function modelById(id){ return models.find(m=>m.id===id)||null; }
function effortOptions(modelId, sel, withDefaultLabel, effectiveDefault){
  const m=modelById(modelId)||modelById(defaultModel)||null;
  const list=(m&&m.supportedReasoningEfforts)||[];
  const def=effectiveDefault!==undefined?effectiveDefault:
    ((m&&m.defaultReasoningEffort)||"");
  const el=$(sel); if(!el) return;
  const keep=el.value;
  el.innerHTML=`<option value="">${withDefaultLabel?("effort: default"+(def?" ("+def+")":"")):("default"+(def?" ("+def+")":""))}</option>`

  if([...el.options].some(o=>o.value===keep)) el.value=keep;

/* ---------- usage / rate limits ----------
   account/rateLimits/read reports a primary window (300 min = 5h) and a
   secondary window (10080 min = 7d), each usedPercent + resetsAt. */
function human(mins){
  if(mins%10080===0) return (mins/10080)+"w";
  if(mins%1440===0)  return (mins/1440)+"d";
  if(mins%60===0)    return (mins/60)+"h";
  return mins+"m";
}
function until(ts){
  return UIContracts.resetCountdown(ts);
}
function bar(name,w){
  if(!w) return "";
  const pct=Math.max(0,Math.min(100,Number(w.usedPercent)||0));
  const cls=pct>=90?"hot":pct>=70?"warn":"";
  return `<div class="u"><div class="lbl"><b>${name}</b>
    <span>${pct}% · resets ${until(w.resetsAt)}</span></div>
    <div class="track"><div class="fill ${cls}" style="width:${pct}%"></div></div></div>`;
}
function safeText(value){
  return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",
    ">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}
function bucketHtml(bucket){
  const rl=bucket.snapshot||{}, p=rl.primary, sec=rl.secondary;
  let html=`<div class="bucket"><div class="bucket-title"><b>${safeText(bucket.name)}</b>`+
    `<span>${safeText(rl.planType||"")}</span></div>`;
  if(p) html+=bar(human(p.windowDurationMins||300),p);
  if(sec) html+=bar(human(sec.windowDurationMins||10080),sec);
  if(rl.spendControlReached) html+=`<div class="note">spend limit reached</div>`;
  const cr=rl.credits||{};
  if(cr.unlimited){
    html+=`<div class="cred"><b>credits</b><span>unlimited</span></div>`;
  } else if(cr.hasCredits){
    const covering=p&&p.usedPercent>=100;
    html+=`<div class="cred${covering?" covering":""}"><b>credits</b>`+
      `<span>${safeText(cr.balance)}</span></div>`;
    if(covering) html+=`<div class="note">${human(p.windowDurationMins||300)} window exhausted \u2014 credits in use</div>`;
  }
  return html+`</div>`;
}
let renderedUsageHtml=null;
async function loadUsage(){
  const r=await rpc("account/rateLimits/read",null,30);
  if(r.error||!r.result){
    // Preserve the last good snapshot, but make a broken account/session
    // visible instead of silently leaving an empty or stale panel.
    let note=$("#usage .usage-error");
    if(!note){ note=document.createElement("div"); note.className="note usage-error";
      $("#usage").append(note); }
    const message=String((r.error&&r.error.message)||"usage request failed");
    note.textContent=/token_expired|token_revoked|401 Unauthorized/i.test(message)
      ?"usage unavailable · authentication expired":"usage temporarily unavailable";
    note.title=message.slice(0,500); return;
  }
  const buckets=UIContracts.rateLimitBuckets(r.result);
  if(!buckets.length){
    if(renderedUsageHtml!=="") $("#usage").innerHTML="";
    renderedUsageHtml=""; return;
  }
  let html=buckets.map(bucketHtml).join("");
  const rc=((r.result||{}).rateLimitResetCredits)||{};
  if(rc.availableCount>0)
    html+=`<div class="note">${rc.availableCount} limit-reset credit(s) available</div>`;
  if(html===renderedUsageHtml&&!$("#usage .usage-error")) return;
  renderedUsageHtml=html;
  $("#usage").innerHTML=html;
}

/* ---------- effective settings ----------
   The protocol's thread object does not report model / sandbox / approval /
   effort, so the bridge reads them out of the state DB. Showing the resolved
   values matters: "default" tells the user nothing. */
function fmtSandbox(j){
  if(!j) return null;
  let o; try{ o=JSON.parse(j); }catch{ return String(j).slice(0,28); }
  const fs=o.file_system||{};
  const writes=(fs.entries||[]).filter(e=>e.access==="write").length;
  const kind=fs.type==="restricted"?"workspace-write":
             (o.type==="dangerFullAccess"?"full-access":fs.type||o.type||"?");
  return `${kind} · ${writes}w · net:${o.network||"?"}`;
}
async function loadMeta(id){
  const chip=(el,txt,title)=>{
    const e=$(el);
    if(!txt){ e.style.display="none"; return; }
    e.style.display="inline-block"; e.textContent=txt; if(title) e.title=title;
  };
  try{
    const response=await fetch("/threadmeta?id="+encodeURIComponent(id));
    if(!response.ok) throw new Error(`metadata read failed (${response.status})`);
    const m=await response.json();
    if(cur!==id) return;
    const fingerprint=JSON.stringify(m);
    if(fingerprint===renderedMetaFingerprint) return;
    renderedMetaFingerprint=fingerprint;
    curMeta=m;
    // The app-server can retain a loaded thread's old cwd even after
    // thread/settings/update has persisted the new value. The state DB is the
    // value the UI advertises, so it is also the value every turn must send.
    if(m.cwd){
      cwdCache[id]=m.cwd;
      curInfo.cwd=m.cwd;
      showCwd(m.cwd);
    }
    chip("#cModel", m.model?("model: "+m.model):null);
    const mm=modelById(m.model);
    const effDef=(mm&&mm.defaultReasoningEffort)||"";
    chip("#cEff", m.reasoning_effort ? ("effort: "+m.reasoning_effort)
                                     : ("effort: "+(effDef||"default")));
    const reviewer=reviewerCache[id];
    chip("#cAppr", reviewer==="auto_review"?"approvals: auto-review":
      (m.approval_mode?("approvals: "+m.approval_mode):null));
    chip("#cSbx",   fmtSandbox(m.sandbox_policy), m.sandbox_policy||"");
    chip("#cTok",   m.tokens_used?(Number(m.tokens_used).toLocaleString()+" tok"):null);
    // reflect EVERY resolved default in the selectors, not just the model
    const setDefault=(sel,label,val)=>{
      const o=$(sel)&&$(sel).options[0];
      if(o) o.textContent=label+(val?" ("+val+")":"");
    };
    setDefault("#selModel","model: default",m.model);
    setDefault("#mModel","default",m.model);
    // Rebuild for EVERY thread, including one whose model is not recorded yet:
    // the state DB trails thread/start, so a freshly created thread reads back
    // empty, and skipping the rebuild left it advertising the previously
    // selected thread's efforts, tiers and resolved defaults as its own.
    // The first options describe resolved thread defaults. Do not turn those
    // defaults into explicit overrides or erase a choice made for the next
    // turn while this turn is paused on an approval.
    defaultModel=m.model||"";
    effortOptions(defaultModel,"#selEffort",true,m.reasoning_effort||"");
    effortOptions(defaultModel,"#mEffort",false,m.reasoning_effort||"");
    tierOptions(defaultModel);
    const sbx=fmtSandbox(m.sandbox_policy);
    setDefault("#mSbx", $("#mSbx").options[0].value, null);
    const appr=$("#selAppr").options[0];
    if(appr&&appr.value===""){
      const resolved=reviewer==="auto_review"?"auto-review":(m.approval_mode||"");
      appr.textContent="approvals: thread default"+(resolved?" ("+resolved+")":"");
    }
  }catch(e){ curMeta={}; }
}

function refreshMetaAfterTurnStart(id){

  // can preserve stale chips for the entire turn, so retry on a short bounded
  // schedule. Never refresh controls for a thread the user has since left.

/* ---------- sub-agent side pane ----------
   Codex sub-agents are separate threads. Resuming one subscribes this
   connection to its events, so both conversations stream side by side. */
let agentCur=null;
const aItemEls={};
function aAdd(cls,who,text){
  const d=document.createElement("div"); d.className="msg "+cls;
  const w=document.createElement("div"); w.className="who";
  const wn=document.createElement("span"); wn.textContent=who;
  const wt=document.createElement("span"); wt.className="ts";
  wt.textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  w.append(wn,wt);
  const b=document.createElement("div"); b.className="body"; b.textContent=text||"";
  d.append(w,b); $("#alog").append(d); $("#alog").scrollTop=$("#alog").scrollHeight;
  return b;
}
function aUpsertItem(it,cls,who,text,{hidden=false,preserve=false}={}){
  const key=it.id||it.itemId;
  let item=key&&aItemEls[key], body;
  if(!item){
    body=aAdd(cls,who,text); item=body.parentElement;
    if(key){ item.dataset.itemId=key; aItemEls[key]=item; }
  }else{
    body=item.querySelector(".body");
    item.className="msg "+cls;
    item.querySelector(".who span").textContent=who;
    if(!(preserve&&!text)) body.textContent=text||"";
  }
  item.classList.toggle("pending",hidden&&!body.textContent);
  return body;
}
function aRenderItem(it,{reserve=false,preserve=false}={}){
  const ty=String(it.type||"");
  if(/^user/i.test(ty)) return aUpsertItem(it,"user","you",textOf(it));
  if(/agentMessage/i.test(ty)){
    const text=textOf(it);
    return aUpsertItem(it,"agent","agent",text,
      {hidden:(reserve||preserve)&&!text,preserve});
  }
  if(/reasoning/i.test(ty)){
    const text=textOf(it);
    return aUpsertItem(it,"rsn","thinking",text,
      {hidden:!text,preserve});
  }
  if(/commandExecution|exec/i.test(ty)){
    const cmd=it.command||it.commandLine||"";
    const out=it.aggregatedOutput||it.output||"";
    return aUpsertItem(it,"cmd","command",
      "$ "+cmd+(out?"\n\n"+String(out).slice(0,2500):""),
      {hidden:reserve&&!cmd});
  }
  return aUpsertItem(it,"tool",ty||"item",
    reserve?"":JSON.stringify(it).slice(0,500),{hidden:reserve});
}
function aAppendDelta(itemId,delta){
  if(!itemId) return;
  let item=aItemEls[itemId], body;
  if(!item){
    body=aUpsertItem({id:itemId},"agent","agent","",{hidden:true});
    item=body.parentElement;
  }else body=item.querySelector(".body");
  item.classList.remove("pending");
  body.textContent+=delta;
  $("#alog").scrollTop=$("#alog").scrollHeight;
}

}

/* ---------- open ---------- */
/* Keep at most three journal pages in browser memory. Each page is read from
   the rollout on demand; there is no transcript cache in either process. */
function installTranscriptPage(page,{direction="reset",focusRow="",preserveLive=false}={}){
  if(!page||!Array.isArray(page.rows)) return;
  const paneTop=logEl.getBoundingClientRect().top;
  const anchor=[...historyEl.querySelectorAll(".msg[data-row-id]")].find(node=>
    node.getBoundingClientRect().bottom>paneTop);
  const anchorId=anchor&&anchor.dataset.rowId;
  const anchorTop=anchor&&anchor.getBoundingClientRect().top;
  historyPages=UIContracts.transcriptPages(historyPages,page,
    {direction,maxPages:HISTORY_MAX_PAGES});
  historyRows=UIContracts.transcriptRows(historyPages);
  historyWarning=[...new Set(historyPages.map(p=>p.journalWarning).filter(Boolean))].join("\n");
  if(direction==="reset"&&!preserveLive){
    liveErrorKeys.clear();
    for(const k in itemEls) delete itemEls[k];
    liveEl.replaceChildren();
  }
  logTarget=liveEl;
  let range=UIContracts.virtualRange({total:historyRows.length,direction:"tail",
    windowSize:HISTORY_WINDOW,chunkSize:HISTORY_CHUNK});
  if(focusRow){
    const index=historyRows.findIndex(row=>row.id===focusRow);
    if(index>=0){
      const start=Math.max(0,Math.min(index-Math.floor(HISTORY_WINDOW/3),
        Math.max(0,historyRows.length-HISTORY_WINDOW)));
      range={start,end:Math.min(historyRows.length,start+HISTORY_WINDOW)};
    }
  }else if(direction!=="reset"&&anchorId){
    const index=historyRows.findIndex(row=>row.id===anchorId);
    if(index>=0){
      const visible=Math.max(1,historyRange.end-historyRange.start);
      range={start:Math.max(0,index),end:Math.min(historyRows.length,index+visible)};
    }
  }
  renderHistoryWindow(range);
  if(anchorId&&!focusRow){
    const replacement=historyEl.querySelector(`[data-row-id="${CSS.escape(anchorId)}"]`);
    if(replacement) logEl.scrollTop+=replacement.getBoundingClientRect().top-anchorTop;
  }
  if(focusRow){
    const node=historyEl.querySelector(`[data-row-id="${CSS.escape(focusRow)}"]`);
    if(node){
      node.classList.add("search-target");
      const pane=logEl.getBoundingClientRect(), rect=node.getBoundingClientRect();
      logEl.scrollTop+=rect.top-pane.top-Math.floor(logEl.clientHeight/3);
    }
  }
  // Local sends are drawn optimistically before app-server has necessarily
  // appended them to the rollout. Keep only those uncommitted echoes in the
  // live tail; persisted history remains virtualized above it.
  if(direction==="reset"&&!preserveLive){
    for(const entry of UIContracts.optimisticEchoesMissingFromTranscript(
      optimisticUserEchoes,{threadId:cur,rows:historyRows})){
      add("user",entry.who,entry.text,entry.at);
    }
  }
  renderedFromRollout=historyRows.length;
  transcriptRevision=page.revision||transcriptRevision;
  transcriptGeneration=page.generation||transcriptGeneration;
  const stick=direction==="reset"&&!focusRow;
  if(stick) logEl.scrollTop=logEl.scrollHeight;
}

let openGeneration=0;
async function open_(id){
  const generation=++openGeneration;
  threadViewReady=false;
  const input=$("#inp");
  if(cur&&cur!==id) await persistDraft(cur,input.value);
  input.disabled=true;
  // Overrides chosen for the thread being left do not describe the thread
  // being entered. Clear before cur moves, so the controls fall back to the
  // incoming thread's resolved defaults.
  if(cur!==id) UIContracts.resetTurnControls($$("#ctl select"));
  cur=id; curTurn=null;
  rememberThreadId(id);
  renderedMetaFingerprint="";
  // Metadata/live subscription and the cacheless journal tail are independent.
  // Start both immediately. Most importantly, never ask app-server to marshal
  // the complete turn graph only to discard it in favour of the journal page.
  const resume=rpc("thread/resume",{threadId:id,excludeTurns:true});
  const tail=fetch("/transcript?id="+encodeURIComponent(id)).then(response=>
    response.json()).catch(()=>({rows:[]}));
  const r=await resume;
  if(generation!==openGeneration||cur!==id) return false;
  if(r.error||!r.result){
    cur=null; curInfo={}; threadViewReady=true; rememberThreadId("");
    clearTranscriptPane(); $("#title").textContent="No thread"; setBusy(false);
    renderList(); return false;
  }
  const opened=r.result||{}, th=opened.thread||{};
  if(opened.approvalsReviewer) reviewerCache[id]=opened.approvalsReviewer;

  // Render straight from the rollout JSONL. It is the authoritative record --
  // ordered, timestamped, and complete, including tool calls and their output
  // (which thread/turns/list does not replay). No client-side cache: that
  // workaround was what duplicated, misordered and mis-stamped messages.
  const page=await tail;
  if(generation!==openGeneration||cur!==id) return;

  curInfo=th;
  $("#title").textContent=th.name||nameCache[id]||(th.preview||"").slice(0,64)||id.slice(0,8);
  if(th.name) nameCache[id]=th.name;
  if(th.cwd){ cwdCache[id]=th.cwd; }
  showCwd(th.cwd||cwdCache[id]||"");
  // Resolve persisted settings, especially cwd, before this thread can send.
  // Otherwise the header can advertise the DB value while turn/start omits it
  // and the app-server silently reuses an older loaded-thread cwd.
  await loadMeta(id);
  installTranscriptPage(page,{direction:"reset"});

  input.value=await loadDraft(id);

  threadViewReady=true;
  setBusy(((th.status||{}).type)==="active");
  renderList(); loadAgents();
  // A completion can land while the transcript snapshot is loading and its
  // live event is intentionally suppressed. Re-read status once the view is
  // attached, then reconcile any final item the snapshot narrowly missed.
  rpc("thread/read",{threadId:id},30).then(latest=>{
    if(cur!==id||!threadViewReady||latest.error) return;
    const current=((latest.result||{}).thread)||{};
    const active=((current.status||{}).type)==="active";
    setBusy(active);
    if(!active) reconcile();
  }).catch(()=>{});
  return true;
}

  if(c) c.onclick=()=>$("#mask").classList.remove("on");
  if(k) k.onclick=createThread;
}
async function createThread(){
  const p=UIContracts.threadStart({cwd:$("#mCwd").value,defaultCwd:DEFAULT_CWD,
    sandbox:$("#mSbx").value,approvalPolicy:$("#mAppr").value,
    model:$("#mModel").value,effort:$("#mEffort").value});
  const btn=$("#mCreate"); btn.disabled=true; btn.textContent="Creating…";
  const r=await rpc("thread/start",p,90);
  btn.disabled=false; btn.textContent="Create";
  if(r.error||!r.result){
    $("#merr").style.display="block";
    $("#merr").textContent=JSON.stringify(r.error||r).slice(0,300); return;
  }
  const th=r.result.thread||r.result;
  const id=th.id||r.result.threadId;
  if(!id){
    $("#merr").style.display="block";
    $("#merr").textContent="thread/start returned no thread id"; return;
  }
  const nm=$("#mName").value.trim();
  if(nm){ await rpc("thread/name/set",{threadId:id,name:nm}); nameCache[id]=nm; }
  cwdCache[id]=p.cwd;
  $("#mask").classList.remove("on");
  await loadThreads(); await open_(id);
  $("#inp").focus();
}

const optimisticUserEchoes=[];
function addOptimisticUser(threadId,text,who){
  const entry={threadId,text,who,at:Date.now()};
  optimisticUserEchoes.push(entry);
  add("user",who,text);
  return entry;
}
function discardOptimisticUser(entry){
  const index=optimisticUserEchoes.indexOf(entry);
  if(index>=0) optimisticUserEchoes.splice(index,1);
}
function consumeOptimisticUser(threadId,item){
  const now=Date.now();
  for(let i=optimisticUserEchoes.length-1;i>=0;i--)
    if(now-optimisticUserEchoes[i].at>120000) optimisticUserEchoes.splice(i,1);
  const index=UIContracts.optimisticEchoIndex(optimisticUserEchoes,
    {threadId,text:textOf(item),nowMs:now});
  if(index<0) return false;
  optimisticUserEchoes.splice(index,1);
  return true;
}
async function send(){
  const t=$("#inp").value.trim();
  if(!t||!cur) return;
  const threadId=cur;

  // A turn is already running -> steer it instead of queueing a new one.
  // This is the whole point of the app: you type into work already in flight.
  if(busy){
    const steerTo=await activeTurnId();
    if(cur!==threadId) return;
    if(!steerTo){ add("err","steer","no active turn to steer"); return; }
    $("#inp").value="";
    await persistDraft(threadId,"");
    const optimistic=addOptimisticUser(threadId,t,"you (steer)");
    const r=await rpc("turn/steer",
      {threadId,expectedTurnId:steerTo,input:[{type:"text",text:t}]},120);
    if(r.error){
      discardOptimisticUser(optimistic);
      if(cur===threadId) add("err","turn/steer",JSON.stringify(r.error).slice(0,400));
    }
    return;
  }

  $("#inp").value="";
  await persistDraft(threadId,"");
  const optimistic=addOptimisticUser(threadId,t,"you");
  setBusy(true);
  const p=UIContracts.turnStart({threadId,text:t,
    cwd:curInfo.cwd||cwdCache[threadId]||"",
    model:$("#selModel").value,effort:$("#selEffort").value,
    approvalPolicy:$("#selAppr").value,
    serviceTier:$("#selTier")&&$("#selTier").value});
  const r=await rpc("turn/start",p,900);
  if(r.error){
    discardOptimisticUser(optimistic);
    if(cur===threadId){ add("err","turn/start",JSON.stringify(r.error).slice(0,400));
      setBusy(false); }
    return;
  }
  if(cur!==threadId) return;
  const tn=(r.result||{}).turn||{};
  if(tn.id) curTurn=tn.id;
  refreshMetaAfterTurnStart(threadId);
}
$("#send").onclick=send;
$("#stop").onclick=async()=>{
  if(!cur) return;
  const threadId=cur;
  const stopTo=await activeTurnId();
  if(cur!==threadId) return;
  if(!stopTo){ add("err","stop","no active turn to interrupt"); return; }
  const r=await rpc("turn/interrupt",{threadId,turnId:stopTo},30);
  if(r.error&&cur===threadId) add("err","turn/interrupt",JSON.stringify(r.error).slice(0,300));
};
$("#inp").addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  if(e.shiftKey) return;                 // Shift+Enter -> newline
  e.preventDefault(); send();            // Enter (and Cmd/Ctrl+Enter) -> send
});
const draftEpochs={}, draftSequences={}, draftLatest={};
function persistDraft(threadId,text){
  if(!threadId) return Promise.resolve();
  const epoch=draftEpochs[threadId];
  if(!Number.isInteger(epoch)) return Promise.resolve();
  const sequence=(draftSequences[threadId]||0)+1;
  draftSequences[threadId]=sequence;
  const body=JSON.stringify({id:threadId,text,epoch,sequence});
  // Writes may finish out of order; the bridge rejects every sequence older
  // than the newest accepted one, so typing never builds a serial HTTP queue.
  const write=fetch("/draft",{
    method:"POST",headers:{"Content-Type":"application/json"},keepalive:true,
    body
  }).catch(()=>{});
  draftLatest[threadId]=write;
  return write;
}
async function loadDraft(threadId){
  if(!threadId) return "";
  await (draftLatest[threadId]||Promise.resolve());
  try{
    const r=await fetch("/draft?id="+encodeURIComponent(threadId));
    const data=await r.json();
    draftEpochs[threadId]=data.epoch; draftSequences[threadId]=0;
    return typeof data.text==="string"?data.text:"";
  }catch(e){ return ""; }
}
$("#inp").addEventListener("input",()=>{
  if(cur) persistDraft(cur,$("#inp").value);
});
window.prepareReload=()=>cur?persistDraft(cur,$("#inp").value):Promise.resolve();
window.addEventListener("pagehide",()=>{
  if(!cur||!Number.isInteger(draftEpochs[cur])) return;
  const sequence=(draftSequences[cur]||0)+1;
  draftSequences[cur]=sequence;
  navigator.sendBeacon("/draft",new Blob([JSON.stringify({
    id:cur,text:$("#inp").value,epoch:draftEpochs[cur],sequence
  })],{type:"application/json"}));
});

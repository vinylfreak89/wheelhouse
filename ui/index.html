<!doctype html>
<meta charset="utf-8">
<title>Wheelhouse</title>
<style>
:root{
  --bg:#141418; --panel:#191920; --panel2:#20202a; --panel3:#262633;
  --line:#2c2c38; --fg:#e8e8f0; --dim:#8f8fa3; --dim2:#6a6a7d;
  --accent:#7aa2f7; --accent2:#9ece6a; --user:#26365c;
  --ok:#9ece6a; --warn:#e0af68; --err:#f7768e; --run:#7dcfff;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{display:flex;background:var(--bg);color:var(--fg);
     font:13.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#33333f;border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#44445a;background-clip:padding-box}

/* ---------- sidebar ---------- */
#side{width:252px;flex:0 0 252px;background:var(--panel);border-right:1px solid var(--line);
      display:flex;flex-direction:column;min-height:0}
#brand{padding:14px 14px 10px;display:flex;align-items:center;gap:8px;-webkit-app-region:drag}
#dot{width:7px;height:7px;border-radius:50%;background:var(--err);transition:background .3s}
#dot.on{background:var(--ok)}
#brand h1{font-size:12px;margin:0;font-weight:700;letter-spacing:.12em;color:var(--dim)}
#newbtn{margin:0 10px 10px;padding:8px;border:1px solid var(--line);background:var(--panel2);
        color:var(--fg);border-radius:7px;cursor:pointer;font-size:13px;transition:.15s}
#newbtn:hover{border-color:var(--accent);background:var(--panel3)}
#tabs{display:flex;gap:2px;padding:0 10px 8px}
.tab{flex:1;padding:5px 3px;font-size:10.5px;text-align:center;border-radius:6px;cursor:pointer;
     color:var(--dim2);border:1px solid transparent;user-select:none}
.tab:hover{color:var(--fg)}
.tab.on{background:var(--panel2);color:var(--fg);border-color:var(--line)}
.tab .n{opacity:.55;margin-left:3px}
#list{flex:1;overflow-y:auto;padding:0 8px 10px;min-height:0}
.grp{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim2);
     padding:10px 6px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th{padding:7px 9px;border-radius:6px;cursor:pointer;margin-bottom:2px;font-size:13px;
    color:var(--dim);display:flex;align-items:center;gap:7px}
.th:hover{background:var(--panel2);color:var(--fg)}
.th.sel{background:var(--panel3);color:var(--fg);box-shadow:inset 2px 0 0 var(--accent)}
.th .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .acts{display:none;gap:2px}
.th:hover .acts{display:flex}
.th .acts button{background:none;border:0;color:var(--dim2);cursor:pointer;padding:0 3px;
  font-size:12px;line-height:1;border-radius:4px}
.th .acts button:hover{color:var(--fg);background:var(--panel3)}
.th .acts button.del:hover{color:var(--err)}
.st{width:6px;height:6px;border-radius:50%;flex:0 0 6px;background:var(--dim2)}
.st.running{background:var(--run);animation:pulse 1.1s infinite}
.st.idle{background:var(--ok);opacity:.55}
.st.errdot{background:var(--err)}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
#empty{color:var(--dim2);font-size:12px;padding:16px 10px;line-height:1.6}
#usage{flex:0 0 auto;border-top:1px solid var(--line);padding:9px 12px 11px;font-size:11px;color:var(--dim2)}
#usage .u{margin-bottom:6px}
#usage .u:last-child{margin-bottom:0}
#usage .lbl{display:flex;justify-content:space-between;margin-bottom:3px}
#usage .lbl b{color:var(--dim);font-weight:600}
#usage .track{height:3px;background:var(--panel3);border-radius:2px;overflow:hidden}
#usage .fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
#usage .fill.warn{background:var(--warn)} #usage .fill.hot{background:var(--err)}
#usage .plan{display:flex;justify-content:space-between;color:var(--dim2);margin-top:7px}

/* ---------- main ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#bar{padding:0 14px;height:44px;flex:0 0 44px;border-bottom:1px solid var(--line);
     display:flex;gap:10px;align-items:center;font-size:12px;color:var(--dim);
     -webkit-app-region:drag}
#bar b{color:var(--fg);font-weight:600;font-size:13px;max-width:340px;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar .sp{flex:1}
.chip{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--panel2);
      border:1px solid var(--line);color:var(--dim);-webkit-app-region:no-drag}
.iconbtn{-webkit-app-region:no-drag;background:none;border:1px solid var(--line);color:var(--dim);
         border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px}
.iconbtn:hover{color:var(--fg);border-color:var(--accent)}
.iconbtn.on{color:var(--accent);border-color:var(--accent)}
#log{flex:1;overflow-y:auto;padding:20px 22px;min-height:0}
.msg{margin-bottom:15px;max-width:840px}
.who{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim2);
     margin-bottom:4px;display:flex;gap:7px;align-items:baseline}
.who .ts{text-transform:none;letter-spacing:0;opacity:.55;font-variant-numeric:tabular-nums}
.body{white-space:pre-wrap;word-wrap:break-word}
.msg.user .body{background:var(--user);padding:9px 12px;border-radius:9px;display:inline-block;max-width:100%}
.msg.tool .body,.msg.cmd .body{font-family:var(--mono);font-size:11.5px;background:var(--panel);
    border:1px solid var(--line);padding:8px 10px;border-radius:6px;color:var(--dim);
    max-height:280px;overflow:auto}
.msg.err .body{color:var(--err);font-family:var(--mono);font-size:12px}
.msg.scaffold .body{color:var(--dim2);font-size:11.5px;font-family:var(--mono);
    max-height:22px;overflow:hidden;cursor:pointer;opacity:.6}
.msg.scaffold.open .body{max-height:none;opacity:1}
.msg.rsn .body{color:var(--dim2);font-style:italic;font-size:12.5px;
    border-left:2px solid var(--line);padding-left:10px}
.appr{border:1px solid var(--warn);border-radius:8px;padding:11px 13px;background:#201d16;margin-bottom:15px}
.appr .t{color:var(--warn);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.appr pre{font-family:var(--mono);font-size:11.5px;margin:0 0 9px;white-space:pre-wrap;
    max-height:190px;overflow:auto;color:var(--fg)}
.appr button{margin-right:7px;padding:5px 13px;border-radius:6px;border:1px solid var(--line);
    cursor:pointer;background:var(--panel2);color:var(--fg)}
.appr button.yes{background:var(--accent2);color:#14140f;border-color:var(--accent2);font-weight:600}
.appr button.no{background:var(--err);color:#fff;border-color:var(--err)}

/* ---------- composer ---------- */
#foot{flex:0 0 auto;border-top:1px solid var(--line);padding:11px 14px;background:var(--panel)}
#row{display:flex;gap:8px;align-items:flex-end}
#inp{flex:1;resize:none;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
     border-radius:9px;padding:10px 12px;font:inherit;max-height:200px;min-height:42px}
#inp:focus{outline:none;border-color:var(--accent)}
.act{padding:10px 15px;border-radius:9px;border:1px solid var(--line);background:var(--accent);
     color:#12121a;font-weight:600;cursor:pointer}
.act:disabled{opacity:.4;cursor:default}
#stop{background:var(--err);color:#fff;border-color:var(--err);display:none}
#ctl{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
select.mini{background:var(--panel2);color:var(--dim);border:1px solid var(--line);
    border-radius:6px;padding:3px 6px;font-size:11px}
select.mini:focus{outline:none;border-color:var(--accent)}

/* ---------- protocol pane ---------- */
#apane{width:390px;flex:0 0 390px;background:var(--panel);border-left:1px solid var(--line);
       display:none;flex-direction:column;min-height:0}
#apane.on{display:flex}
#apane header{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:7px;font-size:11px;color:var(--dim)}
#apane header .sp{flex:1}
#apane header #aTitle{color:var(--fg);font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;max-width:170px}
#alog{flex:1;overflow-y:auto;padding:12px;min-height:0}
#alog .msg{margin-bottom:11px;max-width:none}
#alog .msg .body{font-size:12.5px}
#wire{width:360px;flex:0 0 360px;background:var(--panel);border-left:1px solid var(--line);
      display:none;flex-direction:column;min-height:0}
#wire.on{display:flex}
#wire header{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;gap:8px;font-size:11px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--dim2)}
#wire header .sp{flex:1}
#wlog{flex:1;overflow-y:auto;padding:8px;font-family:var(--mono);font-size:10.5px;min-height:0}
.w{margin-bottom:5px;border-left:2px solid var(--line);padding-left:7px}
.w.out{border-color:var(--accent)}
.w.in{border-color:var(--accent2)}
.w.note{border-color:var(--dim2)}
.w.werr{border-color:var(--err)}
.w .h{color:var(--dim);margin-bottom:1px}
.w .h .m{color:var(--fg)}
.w .p{color:var(--dim2);white-space:pre-wrap;word-break:break-all;max-height:80px;overflow:hidden}
.w.open .p{max-height:none}

/* ---------- modal ---------- */
#mask{position:fixed;inset:0;background:#000a;display:none;align-items:center;
      justify-content:center;z-index:50}
#mask.on{display:flex}
#modal{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
       padding:20px;width:520px;max-width:92vw;box-shadow:0 18px 50px #000b}
#modal h2{margin:0 0 14px;font-size:15px}
.f{margin-bottom:11px}
.f label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
.f input,.f select{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:8px 10px;font:inherit}
.f input:focus,.f select:focus{outline:none;border-color:var(--accent)}
.two{display:flex;gap:10px}.two>*{flex:1}
#mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#mbtns button{padding:8px 16px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--fg);cursor:pointer}
#mbtns button.pri{background:var(--accent);color:#12121a;border-color:var(--accent);font-weight:600}
#merr{color:var(--err);font-size:12px;margin-top:8px;display:none}
</style>

<div id="side">

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const logEl=$("#log"), listEl=$("#list"), wlogEl=$("#wlog");
let cur=null, curInfo={}, busy=false, streamEl=null, reasonEl=null;
let curTurn=null;                 // active turn id: turn/steer and turn/interrupt both need it

/* curTurn is only ever set by a live turn/started event, so it is null whenever
   the turn began while this view was not listening: switching to a thread that
   is already running, reloading mid-turn, or a turn started from the CLI while
   the UI sat on another thread. Ask the server rather than refusing to act --
   this is what bin/codex-run has always done. */
async function activeTurnId(){
  if(curTurn) return curTurn;
  try{
    const r=await rpc("thread/turns/list",
      {threadId:cur,limit:1,sortDirection:"desc"},30);
    const t=((r.result&&r.result.data)||[])[0];
    if(t&&t.id){ curTurn=t.id; return curTurn; }
  }catch(e){}
  return null;
}
let threads=[], tab="projects", models=[], wirePaused=false;
const cwdCache={};
let DEFAULT_CWD="";        /* supplied by the bridge; see loadProjects */

async function rpc(method,params,timeout){
  try{
    const r=await fetch("/rpc",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({method,params,timeout})});
    return await r.json();
  }catch(e){ return {error:{message:String(e)}}; }
}
const respond=(id,result)=>fetch("/respond",{method:"POST",
  headers:{"Content-Type":"application/json"},body:JSON.stringify({id,result})});

/* ---------- rendering ---------- */
const itemEls={};                 // item id -> .msg element, for in-place updates

/* The transcript is rendered from the rollout JSONL via /transcript.
   There is deliberately NO client-side cache: the earlier one duplicated,
   misordered and mis-stamped messages, and the rollout already holds
   everything it was trying to preserve. */

function fmtTs(ms){
  if(!ms) return "";
  return new Date(ms).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
function add(cls,who,text,ts){
  // ts is the message's REAL time, from the rollout. Live messages omit it
  // (=> now). NULL MEANS UNKNOWN -- render nothing rather than stamping "now",
  // which made every replayed message show the same clock.
  const when = (ts === null) ? null : (ts || Date.now());
  const d=document.createElement("div");
  d.className="msg "+cls;
  const w=document.createElement("div"); w.className="who";
  const wn=document.createElement("span"); wn.textContent=who;
  const wt=document.createElement("span"); wt.className="ts";
  wt.textContent = when ? fmtTs(when) : "";
  w.append(wn,wt);
  if(when) d.dataset.ts=String(when);
  const b=document.createElement("div"); b.className="body"; b.textContent=text||"";
  d.append(w,b); logEl.append(d); logEl.scrollTop=logEl.scrollHeight;
  // Cache ONLY what server history does not replay (commands / tool items).
  // Caching messages too meant every re-render added the server's copy AND the
  // cached copy -- messages doubled, then tripled as reconcile ran.
  return b;
}
let replaying=false;
function atBottom(){ return logEl.scrollHeight-logEl.scrollTop-logEl.clientHeight < 60; }
function setBusy(b){
  busy=b;
  $("#send").textContent=b?"Steer":"Send";
  $("#send").disabled=!cur;
  $("#stop").style.display=b?"inline-block":"none";
  $("#inp").disabled=!cur;
}
function textOf(it){
  if(typeof it.text==="string") return it.text;
  if(Array.isArray(it.content)) return it.content.map(c=>c.text||c.content||"").join("");
  if(typeof it.message==="string") return it.message;
  return "";
}
function renderItem(it,ts){
  const ty=String(it.type||it.itemType||"");
  if(/^user/i.test(ty)) return add("user","you",textOf(it)||JSON.stringify(it).slice(0,600),ts);
  if(/agentMessage|agent_message/i.test(ty)){
    const ph=it.phase||"";   // commentary = thinking aloud, final_answer = the result
    return add(ph==="commentary"?"rsn":"agent",
               ph==="commentary"?"codex \u00b7 thinking":"codex", textOf(it), ts);
  }
  if(/reasoning/i.test(ty)){ const t=textOf(it); return t?add("rsn","thinking",t,ts):null; }
  if(/commandExecution|exec/i.test(ty)){
    const cmd=it.command||it.commandLine||(it.parsedCmd&&JSON.stringify(it.parsedCmd))||"";
    const out=it.aggregatedOutput||it.output||it.stdout||"";
    const st=it.status||it.exitCode;
    const text="$ "+String(cmd)+(out?"\n\n"+String(out).slice(0,6000):"");
    const key=it.id||it.itemId;
    // item/started then item/completed arrive for the SAME item -- update in
    // place instead of appending a second block.
    if(key&&itemEls[key]){
      const who2="command"+(st!==undefined&&st!==null?" \u00b7 "+st:"");
      itemEls[key].querySelector(".body").textContent=text;
      itemEls[key].querySelector(".who span").textContent=who2;
      txUpdateLast(key,who2,text);
      return itemEls[key].querySelector(".body");
    }
    const stick=atBottom();
    const b=add("cmd","command"+(st!==undefined&&st!==null?" \u00b7 "+st:""),text,ts);
    if(key){ itemEls[key]=b.parentElement;
             }
    if(stick) logEl.scrollTop=logEl.scrollHeight;
    return b;
  }
  if(/fileChange|patch|applyPatch/i.test(ty)){
    const f=(it.changes||it.files||[]).map?.(x=>x.path||x).join("\n")||JSON.stringify(it).slice(0,900);
    return add("tool","file change",f,ts);
  }
  if(/webSearch/i.test(ty)){
    const q=it.query||it.q||(it.action&&it.action.query)||"";
    const n=(it.results||it.sources||[]).length;
    return add("tool","web search", q?(q+(n?`\n\n${n} result(s)`:"")):JSON.stringify(it).slice(0,400), ts);
  }
  if(/mcp|toolCall|dynamicTool/i.test(ty)){
    const nm=it.toolName||it.name||it.tool||"tool";
    const args=it.arguments||it.args||it.input;
    return add("tool",String(nm),
      args?(typeof args==="string"?args:JSON.stringify(args,null,1)).slice(0,1200):"", ts);
  }
  if(/todo|plan/i.test(ty)){
    const items=(it.items||it.todos||[]);
    if(items.length) return add("tool","plan",
      items.map(x=>`${x.status==="completed"?"[x]":x.status==="inProgress"?"[~]":"[ ]"} ${x.text||x.title||x}`).join("\n"), ts);
  }
  if(/error/i.test(ty)) return add("err",ty,textOf(it)||JSON.stringify(it).slice(0,600),ts);
  // unknown item type: show the type plainly, payload collapsed
  return add("tool",ty||"item",JSON.stringify(it,null,1).slice(0,900),ts);
}

/* ---------- protocol pane ---------- */
function wire(dir,rpcName,id,payload,isErr){
  if(wirePaused) return;
  const d=document.createElement("div");
  d.className="w "+(isErr?"werr":dir==="out"?"out":dir==="in"?"in":"note");
  const h=document.createElement("div"); h.className="h";
  const arrow=dir==="out"?"→":dir==="in"?"←":"·";
  h.innerHTML=`${arrow} <span class="m"></span> <span style="opacity:.5">${id??""}</span>`;
  h.querySelector(".m").textContent=rpcName||"";
  const p=document.createElement("div"); p.className="p"; p.textContent=payload||"";
  d.append(h,p);
  d.onclick=()=>d.classList.toggle("open");
  wlogEl.append(d);
  while(wlogEl.children.length>400) wlogEl.firstChild.remove();
  wlogEl.scrollTop=wlogEl.scrollHeight;
}

/* ---------- thread list ---------- */
async function cwdOf(id){
  if(cwdCache[id]!==undefined) return cwdCache[id];
  const r=await rpc("thread/read",{threadId:id});
  const th=(r.result&&r.result.thread)||{};
  cwdCache[id]=th.cwd||"";
  if(th.name) nameCache[id]=th.name;
  return cwdCache[id];
}
const nameCache={};
/* A thread's PROJECT is pinned by bin/codex-run and served from /projects.
   It is deliberately not threads.cwd: a turn's --cwd overwrites that column,
   which used to drag a conversation into whatever directory the work touched. */
let projReg={threads:{},roots:{}};
async function loadProjects(){
  try{ projReg=await (await fetch("/projects")).json()||{}; }catch(e){}
  projReg.threads??={}; projReg.roots??={};
  if(projReg.defaultCwd) DEFAULT_CWD=projReg.defaultCwd;
}
const base=p=>(p||"").replace(/\/+$/,"").split("/").pop()||"";
function projRootOf(id){ return (projReg.threads[id]||{}).root || cwdCache[id] || ""; }
function projOf(id){
  const pin=projReg.threads[id];
  if(pin&&pin.name) return pin.name;
  return base(cwdCache[id])||"(no project)";
}
async function loadThreads(){
  const r=await rpc("thread/list",{limit:100});
  threads=(r.result&&r.result.data)||[];
  await loadProjects();
  await Promise.all(threads.slice(0,60).map(t=>cwdOf(t.id).catch(()=>"")));
  const running=threads.filter(t=>isActive(t)).length;
  $("#nR").textContent=running?` ${running}`:"";
  $("#nD").textContent=threads.length?` ${threads.length-running}`:"";
  const projs=new Set(threads.map(t=>projOf(t.id))); projs.delete("(no project)");
  $("#nP").textContent=projs.size?` ${projs.size}`:"";
  renderList();
}
const isActive=t=>((t.status||{}).type)==="active";
/* Sub-agent threads carry no name -- the useful identity is the nickname plus
   which agent definition ran (source.subagent.thread_spawn.agent_path). */
function agentLabel(a){
  return a.agentNickname || a.agentRole || (a.id||"").slice(0,8);
}
function agentKind(a){
  const src=a.source;
  let path="";
  try{
    const o=(typeof src==="string")?JSON.parse(src):src;
    // the API returns source.subAgent (camelCase); the DB column is subagent
    const sa=(o||{}).subAgent||(o||{}).subagent||{};
    path=(sa.thread_spawn||sa.threadSpawn||{}).agent_path||"";
  }catch(e){}
  if(!path && a.agentRole) return a.agentRole;
  return path ? path.split("/").filter(Boolean).pop() : "";
}
let agents=[];        // sub-agent threads spawned by the open thread

/* Codex sub-agents are SEPARATE THREADS linked by spawn edges, not inline tool
   calls. They are excluded from a default thread/list because sourceKinds
   defaults to interactive-only, so ask for them explicitly. */
async function loadAgents(){
  // Sub-agent threads are ONLY reachable via ancestorThreadId -- a plain
  // thread/list never returns them, whatever sourceKinds you pass. So with no
  // thread open, aggregate descendants across the threads we know about.
  let rows=[];
  if(cur){
    const r=await rpc("thread/list",{ancestorThreadId:cur,limit:50},40);
    rows=(r.result&&r.result.data)||[];
    rows.forEach(x=>x.parentThreadId=x.parentThreadId||cur);
  } else {
    const parents=threads.slice(0,25);
    const res=await Promise.all(parents.map(pt=>
      rpc("thread/list",{ancestorThreadId:pt.id,limit:50},40)
        .then(r=>((r.result&&r.result.data)||[]).map(x=>{
          x.parentThreadId=x.parentThreadId||pt.id; return x; }))
        .catch(()=>[])));
    rows=res.flat();
  }
  agents=rows;
  $("#nA").textContent=agents.length?` ${agents.length}`:"";
  if(tab==="agents") renderList();
}
function label(t){ return t.name||nameCache[t.id]||t.preview||t.id.slice(0,8); }
function renderList(){
  listEl.innerHTML="";
  let rows=threads;
  if(tab==="running") rows=threads.filter(t=>isActive(t));
  if(tab==="done")    rows=threads.filter(t=>!isActive(t));
  if(tab==="agents"){
    if(agents.length){
      // group under the parent thread so provenance is obvious
      const byParent={};
      for(const a of agents){
        const k=a.parentThreadId||cur||"(unknown)";
        (byParent[k]??=[]).push(a);
      }
      for(const pid of Object.keys(byParent)){
        const pt=threads.find(x=>x.id===pid);
        const g=document.createElement("div"); g.className="grp";
        g.textContent="\u21b3 "+(pt?label(pt):(nameCache[pid]||pid.slice(0,8)));
        g.title=pid;
        g.style.cursor="pointer";
        g.onclick=()=>{ if(pt||pid) open_(pid); };
        listEl.append(g);
        for(const a of byParent[pid]){
          const d=row(a, agentLabel(a));
          d.onclick=()=>openAgent(a.id,agentLabel(a));
          const meta=document.createElement("span");
          meta.style.cssText="font-size:10px;color:var(--dim2);margin-left:4px;flex:0 0 auto";
          meta.textContent=agentKind(a);
          d.append(meta);
          listEl.append(d);
        }
      }
      return;
    }
    if(!agents.length){ const e=document.createElement("div"); e.id="empty";
      e.textContent=cur?"No sub-agents spawned by this thread."
                       :"No sub-agent threads.";
      listEl.append(e); return; }
    for(const a of agents){
      const d=row(a, agentLabel(a));
      d.onclick=()=>openAgent(a.id,agentLabel(a));
      const meta=document.createElement("span");
      meta.style.cssText="font-size:10px;color:var(--dim2);margin-left:4px;flex:0 0 auto";
      meta.textContent=agentKind(a);
      d.append(meta);
      listEl.append(d);
    }
    return;
  }
  if(!rows.length){
    const e=document.createElement("div"); e.id="empty";
    e.textContent=threads.length?"Nothing here.":"No threads yet — create one to start.";
    listEl.append(e); return;
  }
  if(tab==="projects"){
    const groups={};
    const roots={};
    for(const t of rows){ const k=projOf(t.id); (groups[k]??=[]).push(t); roots[k]??=projRootOf(t.id); }
    for(const k of Object.keys(groups).sort()){
      const g=document.createElement("div"); g.className="grp";
      g.textContent=k;                       /* the name, not the path */
      g.title=(roots[k]||"").replace(/^\/Users\/[^/]+\//,"~/");
      listEl.append(g);
      groups[k].forEach(t=>listEl.append(row(t)));
    }
  } else rows.forEach(t=>listEl.append(row(t)));
}
function row(t, labelOverride){
  const d=document.createElement("div");
  d.className="th"+(t.id===cur?" sel":"");
  const ty=(t.status||{}).type;
  const st=document.createElement("span");
  st.className="st "+(isActive(t)?"running":ty==="systemError"?"errdot":"idle");
  if(ty==="systemError") st.title="system error";
  const flags=((t.status||{}).activeFlags)||[];
  if(flags.length) st.title=flags.join(", ");
  const nm=document.createElement("span"); nm.className="nm";
  nm.textContent=labelOverride||label(t);
  const acts=document.createElement("span"); acts.className="acts";
  const mkAct=(sym,title,cls,fn)=>{
    const b=document.createElement("button");
    b.textContent=sym; b.title=title; if(cls) b.className=cls;
    b.onclick=async e=>{ e.stopPropagation(); await fn(); };
    acts.append(b);
  };
  mkAct("\u2913","Archive \u2014 tidies up, keeps the transcript",null,async()=>{
    // Sub-agents belong to their parent: archiving the parent must take them
    // with it, or they linger with no visible owner.
    const kidsR=await rpc("thread/list",{ancestorThreadId:t.id,limit:50},40);
    const kids=(kidsR.result||{}).data||kidsR.data||[];
    for(const k of kids) await rpc("thread/archive",{threadId:k.id});
    await rpc("thread/archive",{threadId:t.id});
    if(kids.length) $("#hint").textContent=`archived with ${kids.length} sub-agent(s)`;
    loadThreads(); loadAgents();
  });
  mkAct("\u00d7","Delete permanently \u2014 removes the transcript too","del",async()=>{
    // Sub-agent threads are persisted with their own rollouts; deleting only
    // the parent would orphan them. Take the whole tree.
    const kidsR=await rpc("thread/list",{ancestorThreadId:t.id,limit:50},40);
    const kids=(kidsR.result||{}).data||kidsR.data||[];
    const extra=kids.length?`\n\nThis also deletes ${kids.length} sub-agent thread(s).`:"";
    const ok=await askConfirm("Delete \u201c"+label(t)+"\u201d and its transcript?"+extra);
    if(!ok) return;
    for(const k of kids){
      await rpc("thread/delete",{threadId:k.id});
    }
    await rpc("thread/delete",{threadId:t.id});
    if(cur===t.id){ cur=null; logEl.innerHTML=""; $("#title").textContent="No thread"; setBusy(false); }
    loadThreads(); loadAgents();
  });
  d.append(st,nm,acts); d.title=t.id;
  d.onclick=()=>open_(t.id);
  d.oncontextmenu=e=>{ e.preventDefault(); threadMenu(t,e.clientX,e.clientY); };
  return d;
}

/* ---------- model capabilities ----------
   Efforts, their default, and service tiers are advertised per model by
   model/list. Hardcoding a scale is wrong: gpt-5.6-sol defaults to "low" and
   supports up to "ultra", while gpt-5.4 tops out at "xhigh". */
function modelById(id){ return models.find(m=>m.id===id)||null; }
function effortOptions(modelId, sel, withDefaultLabel){
  const m=modelById(modelId)||modelById(defaultModel)||models[0];
  const list=(m&&m.supportedReasoningEfforts)||[];
  const def=(m&&m.defaultReasoningEffort)||"";
  const el=$(sel); if(!el) return;
  const keep=el.value;
  el.innerHTML=`<option value="">${withDefaultLabel?("effort: default"+(def?" ("+def+")":"")):("default"+(def?" ("+def+")":""))}</option>`
    +list.map(o=>`<option value="${o.reasoningEffort}" title="${(o.description||"").replace(/"/g,"")}">${o.reasoningEffort}</option>`).join("");
  if([...el.options].some(o=>o.value===keep)) el.value=keep;
}
function tierOptions(modelId){
  const m=modelById(modelId)||modelById(defaultModel)||models[0];
  const tiers=(m&&m.serviceTiers)||[];
  const el=$("#selTier"); if(!el) return;
  el.innerHTML=`<option value="">tier: default</option>`
    +tiers.map(t=>`<option value="${t.id}" title="${(t.description||"").replace(/"/g,"")}">${t.name||t.id}</option>`).join("");
  el.style.display=tiers.length?"":"none";
}
let defaultModel="";

/* ---------- usage / rate limits ----------
   account/rateLimits/read reports a primary window (300 min = 5h) and a
   secondary window (10080 min = 7d), each usedPercent + resetsAt. */
function human(mins){
  if(mins%10080===0) return (mins/10080)+"w";
  if(mins%1440===0)  return (mins/1440)+"d";
  if(mins%60===0)    return (mins/60)+"h";
  return mins+"m";
}
function until(ts){
  if(!ts) return "";
  const s=ts*1000-Date.now();
  if(s<=0) return "now";
  const h=Math.floor(s/3.6e6), m=Math.round((s%3.6e6)/6e4);
  return h>=24?`${Math.floor(h/24)}d ${h%24}h`:(h?`${h}h ${m}m`:`${m}m`);
}
function bar(name,w){
  if(!w) return "";
  const pct=Math.max(0,Math.min(100,Number(w.usedPercent)||0));
  const cls=pct>=90?"hot":pct>=70?"warn":"";
  return `<div class="u"><div class="lbl"><b>${name}</b>
    <span>${pct}% · resets ${until(w.resetsAt)}</span></div>
    <div class="track"><div class="fill ${cls}" style="width:${pct}%"></div></div></div>`;
}
async function loadUsage(){
  const r=await rpc("account/rateLimits/read",{},30);
  const rl=((r.result||{}).rateLimits)||{};
  if(!rl.primary&&!rl.secondary){ $("#usage").innerHTML=""; return; }
  const p=rl.primary, sec=rl.secondary;
  let html="";
  if(p)   html+=bar(human(p.windowDurationMins||300), p);
  if(sec) html+=bar(human(sec.windowDurationMins||10080), sec);
  const cr=rl.credits||{};
  html+=`<div class="plan"><span>${rl.planType||""}</span><span>${
    cr.unlimited?"unlimited":(cr.hasCredits?("credits "+cr.balance):"")}</span></div>`;
  $("#usage").innerHTML=html;
}

/* ---------- effective settings ----------
   The protocol's thread object does not report model / sandbox / approval /
   effort, so the bridge reads them out of the state DB. Showing the resolved
   values matters: "default" tells the user nothing. */
function fmtSandbox(j){
  if(!j) return null;
  let o; try{ o=JSON.parse(j); }catch{ return String(j).slice(0,28); }
  const fs=o.file_system||{};
  const writes=(fs.entries||[]).filter(e=>e.access==="write").length;
  const kind=fs.type==="restricted"?"workspace-write":
             (o.type==="dangerFullAccess"?"full-access":fs.type||o.type||"?");
  return `${kind} · ${writes}w · net:${o.network||"?"}`;
}
async function loadMeta(id){
  const chip=(el,txt,title)=>{
    const e=$(el);
    if(!txt){ e.style.display="none"; return; }
    e.style.display="inline-block"; e.textContent=txt; if(title) e.title=title;
  };
  try{
    const m=await (await fetch("/threadmeta?id="+encodeURIComponent(id))).json();
    curMeta=m;
    chip("#cModel", m.model?("model: "+m.model):null);
    const mm=modelById(m.model);
    const effDef=(mm&&mm.defaultReasoningEffort)||"";
    chip("#cEff", m.reasoning_effort ? ("effort: "+m.reasoning_effort)
                                     : ("effort: "+(effDef||"default")));
    chip("#cAppr",  m.approval_mode?("approvals: "+m.approval_mode):null);
    chip("#cSbx",   fmtSandbox(m.sandbox_policy), m.sandbox_policy||"");
    chip("#cTok",   m.tokens_used?(Number(m.tokens_used).toLocaleString()+" tok"):null);
    // reflect EVERY resolved default in the selectors, not just the model
    const setDefault=(sel,label,val)=>{
      const o=$(sel)&&$(sel).options[0];
      if(o) o.textContent=label+(val?" ("+val+")":"");
    };
    setDefault("#selModel","model: default",m.model);
    setDefault("#mModel","default",m.model);
    if(m.model){ defaultModel=m.model;
      effortOptions(m.model,"#selEffort",true);
      effortOptions(m.model,"#mEffort",false);
      tierOptions(m.model);
      // reflect the THREAD's actual effort, not just the model default
      const se=$("#selEffort");
      if(m.reasoning_effort &&
         [...se.options].some(o=>o.value===m.reasoning_effort)){
        se.value=m.reasoning_effort;
      }
      if(m.model && [...$("#selModel").options].some(o=>o.value===m.model)){
        $("#selModel").value=m.model;
      }
    }
    const sbx=fmtSandbox(m.sandbox_policy);
    setDefault("#mSbx", $("#mSbx").options[0].value, null);
    if(m.approval_mode){
      const o=$("#selAppr").options[0];
      if(o&&o.value==="") o.textContent="approvals: thread default ("+m.approval_mode+")";
    }
  }catch(e){ curMeta={}; }
}
let curMeta={};

/* ---------- sub-agent side pane ----------
   Codex sub-agents are separate threads. Resuming one subscribes this
   connection to its events, so both conversations stream side by side. */
let agentCur=null;
function aAdd(cls,who,text){
  const d=document.createElement("div"); d.className="msg "+cls;
  const w=document.createElement("div"); w.className="who";
  const wn=document.createElement("span"); wn.textContent=who;
  const wt=document.createElement("span"); wt.className="ts";
  wt.textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  w.append(wn,wt);
  const b=document.createElement("div"); b.className="body"; b.textContent=text||"";
  d.append(w,b); $("#alog").append(d); $("#alog").scrollTop=$("#alog").scrollHeight;
  return b;
}
let aStream=null;
function aRenderItem(it){
  const ty=String(it.type||"");
  if(/^user/i.test(ty))            return aAdd("user","you",textOf(it));
  if(/agentMessage/i.test(ty))     return aAdd("agent","agent",textOf(it));
  if(/reasoning/i.test(ty)){ const t=textOf(it); return t?aAdd("rsn","thinking",t):null; }
  if(/commandExecution|exec/i.test(ty)){
    const cmd=it.command||it.commandLine||"";
    const out=it.aggregatedOutput||it.output||"";
    return aAdd("cmd","command","$ "+cmd+(out?"\n\n"+String(out).slice(0,2500):""));
  }
  return aAdd("tool",ty||"item",JSON.stringify(it).slice(0,500));
}
async function openAgent(id,nickname){
  agentCur=id; aStream=null;
  $("#alog").innerHTML="";
  $("#apane").classList.add("on");
  $("#aTitle").textContent=nickname||id.slice(0,8);
  await rpc("thread/resume",{threadId:id});          // subscribes us to its events
  const tl=await rpc("thread/turns/list",
    {threadId:id,limit:60,sortDirection:"asc",itemsView:"full"},90);
  let turns=(tl.result&&tl.result.data)||[];
  if(!turns.length){
    const rd=await rpc("thread/read",{threadId:id,includeTurns:true},90);
    turns=((rd.result||{}).thread||{}).turns||[];
  }
  for(const t of turns) for(const it of (t.items||[])) aRenderItem(it);
}
$("#aClose").onclick=()=>{
  if(agentCur) rpc("thread/unsubscribe",{threadId:agentCur});
  agentCur=null; $("#apane").classList.remove("on"); $("#alog").innerHTML="";
};
$("#aOpen").onclick=()=>{ if(agentCur){ const id=agentCur; $("#aClose").onclick(); open_(id); } };

  });

/* in-page prompt/confirm -- WKWebView ignores window.prompt entirely */
function askText(title,initial){
  return new Promise(res=>{
    $("#mask").classList.add("on");
    const box=$("#modal");
    const prev=box.innerHTML;
    box.innerHTML=`<h2></h2><div class="f"><input id="axInp"></div>
      <div id="mbtns"><button id="axC">Cancel</button>
      <button class="pri" id="axOK">OK</button></div>`;
    box.querySelector("h2").textContent=title;
    const inp=box.querySelector("#axInp"); inp.value=initial||"";
    const fin=v=>{ box.innerHTML=prev; $("#mask").classList.remove("on"); bindModal(); res(v); };
    box.querySelector("#axOK").onclick=()=>fin(inp.value.trim());
    box.querySelector("#axC").onclick=()=>fin(null);
    inp.onkeydown=e=>{ if(e.key==="Enter") fin(inp.value.trim());
                       if(e.key==="Escape") fin(null); };
    setTimeout(()=>{ inp.focus(); inp.select(); },40);
  });
}
function askConfirm(msg){
  return new Promise(res=>{
    $("#mask").classList.add("on");
    const box=$("#modal"); const prev=box.innerHTML;
    box.innerHTML=`<h2></h2><div id="mbtns"><button id="axC">Cancel</button>
      <button class="pri" id="axOK">OK</button></div>`;
    box.querySelector("h2").textContent=msg;
    const fin=v=>{ box.innerHTML=prev; $("#mask").classList.remove("on"); bindModal(); res(v); };
    box.querySelector("#axOK").onclick=()=>fin(true);
    box.querySelector("#axC").onclick=()=>fin(false);
  });
}

/* ---------- open ---------- */
async function open_(id){
  cur=id; logEl.innerHTML=""; streamEl=null; reasonEl=null; curTurn=null;
  for(const k of Object.keys(apprEls)) delete apprEls[k];
  for(const k in itemEls) delete itemEls[k];
  const r=await rpc("thread/resume",{threadId:id});
  const th=(r.result&&r.result.thread)||{};
  curInfo=th;
  $("#title").textContent=th.name||nameCache[id]||(th.preview||"").slice(0,64)||id.slice(0,8);
  if(th.name) nameCache[id]=th.name;
  if(th.cwd){ cwdCache[id]=th.cwd; }
  loadMeta(id);

  // Render straight from the rollout JSONL. It is the authoritative record --
  // ordered, timestamped, and complete, including tool calls and their output
  // (which thread/turns/list does not replay). No client-side cache: that
  // workaround was what duplicated, misordered and mis-stamped messages.
  let rows=[];
  try{
    const t=await (await fetch("/transcript?id="+encodeURIComponent(id))).json();
    rows=t.rows||[];
  }catch(e){}
  replaying=true;
  for(const row of rows){
    const ms=Date.parse(row.ts);
    if(row.cls==="scaffold"){
      const b=add("scaffold","injected: "+row.who,
                  `(${row.text.length.toLocaleString()} chars — click to expand)`,
                  isNaN(ms)?null:ms);
      const box=b.parentElement, full=row.text;
      let shown=false;
      box.onclick=()=>{ shown=!shown; box.classList.toggle("open",shown);
                        b.textContent = shown ? full
                          : `(${full.length.toLocaleString()} chars — click to expand)`; };
      continue;
    }
    add(row.cls, row.who, row.text, isNaN(ms)?null:ms);
  }
  replaying=false;
  renderedFromRollout=rows.length;

  setBusy(((th.status||{}).type)==="active");
  renderList(); loadAgents(); logEl.scrollTop=logEl.scrollHeight;
}
let renderedFromRollout=0;

  $("#mCwd").value=cwdCache[cur]||DEFAULT_CWD;
  $("#merr").style.display="none";
  $("#mask").classList.add("on");
  setTimeout(()=>$("#mName").focus(),40);
};
$("#newbtn").onclick=window.openNewThread;
$("#mask").onclick=e=>{ if(e.target.id==="mask") $("#mask").classList.remove("on"); };
function bindModal(){
  const c=$("#mCancel"), k=$("#mCreate");
  if(c) c.onclick=()=>$("#mask").classList.remove("on");
  if(k) k.onclick=createThread;
}
async function createThread(){
  const p={cwd:$("#mCwd").value.trim()||DEFAULT_CWD,
           sandbox:$("#mSbx").value, approvalPolicy:$("#mAppr").value,
           threadSource:"user"};
  if($("#mModel").value) p.model=$("#mModel").value;
  if($("#mEffort").value) p.config={model_reasoning_effort:$("#mEffort").value};
  const btn=$("#mCreate"); btn.disabled=true; btn.textContent="Creating…";
  const r=await rpc("thread/start",p,90);
  btn.disabled=false; btn.textContent="Create";
  if(r.error||!r.result){
    $("#merr").style.display="block";
    $("#merr").textContent=JSON.stringify(r.error||r).slice(0,300); return;
  }
  const th=r.result.thread||r.result;
  const id=th.id||r.result.threadId;
  const nm=$("#mName").value.trim();
  if(nm){ await rpc("thread/name/set",{threadId:id,name:nm}); nameCache[id]=nm; }
  cwdCache[id]=p.cwd;
  $("#mask").classList.remove("on");
  await loadThreads(); await open_(id);
  $("#inp").focus();
}
bindModal();

/* ---------- send ---------- */
async function send(){
  const t=$("#inp").value.trim();
  if(!t||!cur) return;

  // A turn is already running -> steer it instead of queueing a new one.
  // This is the whole point of the app: you type into work already in flight.
  if(busy){
    const steerTo=await activeTurnId();
    if(!steerTo){ add("err","steer","no active turn to steer"); return; }
    $("#inp").value="";
    add("user","you (steer)",t);
    const r=await rpc("turn/steer",
      {threadId:cur,expectedTurnId:steerTo,input:[{type:"text",text:t}]},120);
    if(r.error) add("err","turn/steer",JSON.stringify(r.error).slice(0,400));
    return;
  }

  $("#inp").value="";
  add("user","you",t);
  setBusy(true);
  const p={threadId:cur,input:[{type:"text",text:t}]};
  if($("#selModel").value) p.model=$("#selModel").value;
  if($("#selEffort").value) p.effort=$("#selEffort").value;
  if($("#selAppr").value) p.approvalPolicy=$("#selAppr").value;
  if($("#selTier")&&$("#selTier").value) p.serviceTier=$("#selTier").value;
  const r=await rpc("turn/start",p,900);
  if(r.error){ add("err","turn/start",JSON.stringify(r.error).slice(0,400)); setBusy(false); return; }
  const tn=(r.result||{}).turn||{};
  if(tn.id) curTurn=tn.id;
}
$("#send").onclick=send;
$("#stop").onclick=async()=>{
  if(!cur) return;
  const stopTo=await activeTurnId();
  if(!stopTo){ add("err","stop","no active turn to interrupt"); return; }
  const r=await rpc("turn/interrupt",{threadId:cur,turnId:stopTo},30);
  if(r.error) add("err","turn/interrupt",JSON.stringify(r.error).slice(0,300));
};
$("#inp").addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  if(e.shiftKey) return;                 // Shift+Enter -> newline
  e.preventDefault(); send();            // Enter (and Cmd/Ctrl+Enter) -> send
});
$$("#tabs .tab").forEach(el=>el.onclick=()=>{
  $$("#tabs .tab").forEach(x=>x.classList.remove("on"));
  el.classList.add("on"); tab=el.dataset.t;
  renderList();
  if(tab==="agents") loadAgents();      // nothing else populates it
});
$("#selModel").onchange=()=>{ effortOptions($("#selModel").value,"#selEffort",true);
                              tierOptions($("#selModel").value); };
$("#mModel").onchange=()=>effortOptions($("#mModel").value,"#mEffort",false);
$("#wireBtn").onclick=()=>{ $("#wire").classList.toggle("on");
  $("#wireBtn").classList.toggle("on",$("#wire").classList.contains("on")); };
$("#wclear").onclick=()=>wlogEl.innerHTML="";
$("#wpause").onclick=()=>{ wirePaused=!wirePaused;
  $("#wpause").textContent=wirePaused?"resume":"pause";
  $("#wpause").classList.toggle("on",wirePaused); };

/* ---------- approvals ---------- */
/* Decision vocabulary DIFFERS per request type -- sending "approved" to a
   request that expects "accept" is treated as a rejection (observed live).
     execCommandApproval / applyPatchApproval -> approved | approved_for_session | abort
     item/commandExecution|fileChange/...     -> accept   | acceptForSession     | decline
     item/permissions/requestApproval         -> {permissions, scope, strictAutoReview}
     item/tool/requestUserInput               -> {answers}                                */
function approvalVocab(method){
  if(/^(execCommandApproval|applyPatchApproval)$/.test(method))
    return {yes:"approved", always:"approved_for_session", no:"abort", key:"decision"};
  if(/requestApproval$/.test(method))
    return {yes:"accept", always:"acceptForSession", no:"decline", key:"decision"};
  return null;
}
const apprEls={};                 // request id -> approval element
function retireApproval(id,label){
  const d=apprEls[id];
  if(!d) return;
  d.querySelectorAll("button").forEach(b=>b.remove());
  if(!d.querySelector(".resolved")){
    const s2=document.createElement("span");
    s2.className="resolved";
    s2.style.cssText="color:var(--dim);font-size:12px";
    s2.textContent=label;
    d.append(s2);
  }
  d.style.opacity=".6";
  delete apprEls[id];
}
function approval(id,method,params){
  const d=document.createElement("div"); d.className="appr";
  apprEls[id]=d;
  const t=document.createElement("div"); t.className="t";
  t.textContent="approval — "+method;
  const pre=document.createElement("pre");
  const cmd=params&&(params.command||params.commandLine);
  pre.textContent=cmd?("$ "+(Array.isArray(cmd)?cmd.join(" "):cmd)+
      (params.reason?("\n\n"+params.reason):""))
    :JSON.stringify(params,null,1).slice(0,1600);
  d.append(t,pre);

  const v=approvalVocab(method);
  const settle=(label,payload)=>{
    respond(id,payload);
    retireApproval(id,label);
  };

  if(v){
    const mk=(txt,cls,val)=>{
      const b=document.createElement("button"); b.textContent=txt;
      if(cls) b.className=cls;
      b.onclick=()=>settle(txt.toLowerCase(),{[v.key]:val});
      d.append(b);
    };
    mk("Approve","yes",v.yes);
    mk("Always",null,v.always);
    mk("Deny","no",v.no);
  } else if(/permissions\/requestApproval/.test(method)){
    // grant exactly what was asked for, scoped to this turn
    const b=document.createElement("button"); b.className="yes"; b.textContent="Grant";
    b.onclick=()=>settle("granted",
      {permissions:(params&&params.permissions)||null,scope:"turn",strictAutoReview:false});
    const n=document.createElement("button"); n.className="no"; n.textContent="Deny";
    n.onclick=()=>settle("denied",{permissions:null,scope:"turn",strictAutoReview:true});
    d.append(b,n);
  } else {
    const b=document.createElement("button"); b.textContent="Dismiss";
    b.onclick=()=>settle("dismissed",{});
    d.append(b);
  }
  logEl.append(d); logEl.scrollTop=logEl.scrollHeight;
}

/* ---------- reconcile ----------
   The view is built from live SSE events plus a one-shot render on thread open.
   Anything that arrives while the thread is closed, during a reload, or in a
   dropped event is never shown -- messages silently go missing. Before trusting
   the view, compare what the server holds against what we have rendered, and
   re-render if the server is ahead. */
let reconciling=false;
async function reconcile(force){
  if(!cur || reconciling) return;
  if(busy && !force) return;              // never disturb an active stream
  reconciling=true;
  try{
    const t=await (await fetch("/transcript?id="+encodeURIComponent(cur))).json();
    const n=(t.rows||[]).length;
    if(n>renderedFromRollout){
      const atEnd=logEl.scrollHeight-logEl.scrollTop-logEl.clientHeight<80;
      await open_(cur);
      if(atEnd) logEl.scrollTop=logEl.scrollHeight;
    }
  }catch(e){}
  finally{ reconciling=false; }
}

/* ---------- events ---------- */
const es=new EventSource("/events");
es.onopen=()=>$("#dot").classList.add("on");
es.onerror=()=>$("#dot").classList.remove("on");
es.onmessage=ev=>{
  let m; try{ m=JSON.parse(ev.data); }catch{ return; }
  const meth=m.method, p=m.params||{};

  if(meth==="bridge/reload"){ location.reload(); return; }
  if(meth==="bridge/wire"){ wire(p.dir,p.rpc,p.id,p.payload,p.err); return; }
  if(meth==="bridge/disconnected"){
    $("#dot").classList.remove("on");
    add("err","bridge","app-server disconnected: "+(p.error||"")); return;
  }
  // server -> client request (approval / user input)
  if(m.id!==undefined&&meth&&!("result"in m)&&!("error"in m)){
    if(/approval|requestUserInput|elicitation/i.test(meth)){ approval(m.id,meth,p); return; }
  }
  // events belonging to the sub-agent shown in the side pane
  if(p.threadId&&agentCur&&p.threadId===agentCur){
    if(meth==="item/agentMessage/delta"){
      if(!aStream) aStream=aAdd("agent","agent","");
      aStream.textContent+=(p.delta??p.text??"");
      $("#alog").scrollTop=$("#alog").scrollHeight;
    } else if(meth==="item/completed"){
      const it=p.item||{};
      if(/agentMessage/i.test(String(it.type||""))) aStream=null; else aRenderItem(it);
    } else if(meth==="turn/completed"||meth==="turn/failed"){ aStream=null; }
    return;
  }
  if(p.threadId&&cur&&p.threadId!==cur){ if(/turn\/(completed|failed|started)/.test(meth)) loadThreads(); return; }

  if(meth==="turn/started"){
    setBusy(true); streamEl=null; reasonEl=null;
    curTurn=(p.turn&&p.turn.id)||p.turnId||curTurn;
  }
  else if(meth==="turn/completed"||meth==="turn/failed"){
    setBusy(false); // any command still labelled inProgress will never be completed now
    for(const el of logEl.querySelectorAll(".msg.cmd .who span")){
      if(/inProgress/i.test(el.textContent)){
        el.textContent=el.textContent.replace(/inProgress/i,
          meth==="turn/failed"?"failed":"ended");
      }
    }
    for(const k of Object.keys(apprEls)) retireApproval(k,"expired");
    streamEl=null; reasonEl=null; curTurn=null; loadThreads();
    if(cur){ loadMeta(cur); loadAgents(); setTimeout(()=>reconcile(true),1200); }
    if(meth==="turn/failed") add("err","turn failed",JSON.stringify(p).slice(0,500));
  }
  else if(meth==="item/agentMessage/delta"){
    if(!streamEl) streamEl=add("agent","codex","");
    streamEl.textContent+=(p.delta??p.text??""); logEl.scrollTop=logEl.scrollHeight;
  }
  else if(/reasoning.*delta/i.test(meth||"")){
    if(!reasonEl) reasonEl=add("rsn","thinking","");
    reasonEl.textContent+=(p.delta??p.text??""); logEl.scrollTop=logEl.scrollHeight;
  }
  else if(meth==="item/started"){
    const ty=String((p.item||{}).type||"");
    if(/commandExecution|exec/i.test(ty)) renderItem(p.item);
  }
  else if(meth==="item/completed"){
    const it=p.item||{}; const ty=String(it.type||"");
    if(/subAgent|collabAgent/i.test(ty)) loadAgents();
    if(/^user/i.test(ty)) return;              // already shown when we sent it
    if(/agentMessage|agent_message/i.test(ty)){ streamEl=null; }
    else if(/reasoning/i.test(ty)){ reasonEl=null; }
    else renderItem(it);
  }
  else if(meth==="serverRequest/resolved"){
    // resolved here, by another client, or cleared by turn lifecycle
    retireApproval(p.requestId,"resolved");
  }
  else if(/^thread\/(started|created|archived|unarchived|deleted|status\/changed|name)/.test(meth||"")){
    loadThreads();
  }
  else if(/subAgent|spawn|collabAgent/i.test(meth||"")){ loadAgents(); }
  else if(meth==="account/rateLimits/updated"){
    const rl=p.rateLimits||p;
    if(rl&&(rl.primary||rl.secondary)){
      const q={result:{rateLimits:rl}};
      // reuse the renderer by faking the rpc shape
      (async()=>{ const prev=window.__rl; window.__rl=rl; try{
        const pr=rl.primary, sc=rl.secondary; let html="";
        if(pr) html+=bar(human(pr.windowDurationMins||300),pr);
        if(sc) html+=bar(human(sc.windowDurationMins||10080),sc);
        const cr=rl.credits||{};
        html+=`<div class="plan"><span>${rl.planType||""}</span><span>${
          cr.unlimited?"unlimited":(cr.hasCredits?("credits "+cr.balance):"")}</span></div>`;
        $("#usage").innerHTML=html;
      }catch(e){ window.__rl=prev; } })();
    } else loadUsage();
  }
};

/* ---------- boot ---------- */
(async()=>{
  const r=await rpc("model/list",{});
  models=((r.result||{}).data)||[];
  const opts=models.filter(m=>!m.hidden)
    .map(m=>`<option value="${m.id}" title="${(m.description||"").replace(/"/g,"")}">${m.displayName||m.id}</option>`).join("");
  $("#mModel").innerHTML=`<option value="">default</option>`+opts;
  $("#selModel").innerHTML=`<option value="">model: default</option>`+opts;
  effortOptions("", "#selEffort", true);
  effortOptions("", "#mEffort", false);
  tierOptions("");
  await loadThreads();
  loadAgents();
  loadUsage();
  setInterval(()=>{ if(!document.hidden) loadUsage(); },120000);
  setInterval(()=>{ loadThreads(); },1000);
  setInterval(()=>{ loadAgents(); },5000);   // sub-agent counts + Agents tab
  setInterval(()=>{ reconcile(false); },6000);  // backfill anything never displayed        // threads must appear promptly,
                                                   // even while backgrounded
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){
    loadThreads(); loadUsage(); if(cur){ loadMeta(cur); reconcile(true); } } });
})();
</script>

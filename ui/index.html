/* ---------- approvals ---------- */
/* Decision vocabulary DIFFERS per request type -- sending "approved" to a
   request that expects "accept" is treated as a rejection (observed live).
   UIContracts owns the exact method map and response builders so tests can
   compare them with the installed app-server schema. */
const apprEls={};                 // request id -> {el, threadId, turnId}
function retireApproval(id,label){
  const record=apprEls[id];
  if(!record) return;
  const d=record.el;
  const stick=atBottom();
  d.querySelectorAll("button").forEach(b=>b.remove());
  if(!d.querySelector(".resolved")){
    const s2=document.createElement("span");
    s2.className="resolved";
    s2.style.cssText="color:var(--dim);font-size:12px";
    s2.textContent=label;
    d.append(s2);
  }
  d.style.opacity=".6";
  // Answered approvals leave the pending tray and drop INLINE into the
  // conversation, where they read as history. Leaving them in the tray made
  // resolved prompts stack up and crowd out live ones. The warning border is
  // scoped to `#approvals .appr`, so it falls away on the move.
  liveEl.append(d);
  if(stick) logEl.scrollTop=logEl.scrollHeight;
  delete apprEls[id];
}
function expireApprovals(threadId,turnId){
  for(const [id,record] of Object.entries(apprEls)){
    const sameThread=!record.threadId||!threadId||record.threadId===threadId;
    const sameTurn=!record.turnId||!turnId||record.turnId===turnId;
    if(sameThread&&sameTurn) retireApproval(id,"expired");
  }
}
function promptError(d,error){
  let e=d.querySelector(".prompt-error");
  if(!e){ e=document.createElement("div"); e.className="prompt-error"; d.append(e); }
  e.textContent=String(error&&error.message||error);
}
function questionField(d,q){
  const wrap=document.createElement("div"); wrap.className="q"; wrap.dataset.questionId=q.id;
  const label=document.createElement("label"); label.textContent=q.header||q.id;
  const help=document.createElement("small"); help.textContent=q.question||"";
  wrap.append(label,help);
  if(q.options&&q.options.length){
    const select=document.createElement("select"); select.dataset.answer="choice";
    for(const option of q.options){
      const el=document.createElement("option"); el.value=option.label; el.textContent=option.label;
      if(option.description) el.title=option.description;
      select.append(el);
    }
    if(q.isOther){
      const el=document.createElement("option"); el.value="__other__"; el.textContent="Other";
      select.append(el);
      const other=document.createElement("input"); other.dataset.answer="other";
      other.placeholder="Other answer"; other.style.display="none";
      select.onchange=()=>other.style.display=select.value==="__other__"?"block":"none";
      wrap.append(select,other);
    } else wrap.append(select);
  } else {
    const input=document.createElement("input"); input.dataset.answer="text";
    input.type=q.isSecret?"password":"text"; wrap.append(input);
  }
  d.append(wrap);
}
function collectQuestions(d){
  const entries=[];
  for(const q of d.querySelectorAll(".q[data-question-id]")){
    const choice=q.querySelector('[data-answer="choice"]');
    const other=q.querySelector('[data-answer="other"]');
    const text=q.querySelector('[data-answer="text"]');
    let value=choice?(choice.value==="__other__"?(other&&other.value.trim()):choice.value)
                    :(text&&text.value.trim());
    if(!value) throw new Error(`Answer required: ${q.dataset.questionId}`);
    entries.push([q.dataset.questionId,[value]]);
  }
  return entries;
}
function elicitationField(d,name,schema,required){
  const wrap=document.createElement("div"); wrap.className="q"; wrap.dataset.elicit=name;
  wrap.dataset.required=required?"true":"false";
  const label=document.createElement("label"); label.textContent=schema.title||name;
  if(schema.description){ const help=document.createElement("small"); help.textContent=schema.description; wrap.append(label,help); }
  else wrap.append(label);
  let input;
  const arrayChoices=schema.type==="array"&&schema.items&&
    (schema.items.enum||(schema.items.anyOf&&schema.items.anyOf.map(x=>x.const)));
  const choices=arrayChoices||schema.enum||(schema.oneOf&&schema.oneOf.map(x=>x.const));
  if(choices){
    input=document.createElement("select");
    input.multiple=Boolean(arrayChoices);
    for(const [i,value] of choices.entries()){
      const option=document.createElement("option"); option.value=value;
      option.textContent=(schema.enumNames&&schema.enumNames[i])||
        (schema.oneOf&&schema.oneOf[i]&&schema.oneOf[i].title)||
        (schema.items&&schema.items.anyOf&&schema.items.anyOf[i]&&
         schema.items.anyOf[i].title)||value;
      input.append(option);
    }
  } else if(schema.type==="boolean"){
    input=document.createElement("input"); input.type="checkbox";
  } else {
    input=document.createElement("input");
    input.type=(schema.type==="number"||schema.type==="integer")?"number":
               (schema.format==="email"?"email":schema.format==="date"?"date":
                schema.format==="date-time"?"datetime-local":"text");
    if(schema.minimum!==undefined) input.min=String(schema.minimum);
    if(schema.maximum!==undefined) input.max=String(schema.maximum);
    if(schema.minLength!==undefined) input.minLength=schema.minLength;
    if(schema.maxLength!==undefined) input.maxLength=schema.maxLength;
  }
  input.dataset.answer="elicitation";
  if(schema.default!==undefined&&schema.default!==null){
    if(input.type==="checkbox") input.checked=Boolean(schema.default);
    else if(input.multiple){
      const selected=new Set(schema.default||[]);
      for(const option of input.options) option.selected=selected.has(option.value);
    } else input.value=String(schema.default);
  }
  if(schema.minItems!==undefined) input.dataset.minItems=String(schema.minItems);
  if(schema.maxItems!==undefined) input.dataset.maxItems=String(schema.maxItems);
  wrap.append(input); d.append(wrap);
}
function collectElicitation(d){
  const content={};
  for(const q of d.querySelectorAll(".q[data-elicit]")){
    const input=q.querySelector('[data-answer="elicitation"]');
    let value=input.multiple?[...input.selectedOptions].map(x=>x.value):
              (input.type==="checkbox"?input.checked:input.value);
    const empty=Array.isArray(value)?value.length===0:value==="";
    if(q.dataset.required==="true"&&empty) throw new Error(`Value required: ${q.dataset.elicit}`);
    if(input.dataset.minItems!==undefined&&value.length<Number(input.dataset.minItems))
      throw new Error(`Select at least ${input.dataset.minItems}: ${q.dataset.elicit}`);
    if(input.dataset.maxItems!==undefined&&value.length>Number(input.dataset.maxItems))
      throw new Error(`Select at most ${input.dataset.maxItems}: ${q.dataset.elicit}`);
    if(empty&&q.dataset.required!=="true") continue;
    if(input.type==="number") value=Number(value);
    content[q.dataset.elicit]=value;
  }
  const raw=d.querySelector('[data-answer="elicitation-json"]');
  if(raw){
    try{ return JSON.parse(raw.value||"{}"); }
    catch(e){ throw new Error("Form response must be valid JSON"); }
  }
  return content;
}
function approval(id,method,params){
  const d=document.createElement("div"); d.className="appr";
  apprEls[id]={el:d,threadId:params&&params.threadId,
               turnId:params&&params.turnId};
  const t=document.createElement("div"); t.className="t";
  t.textContent="approval — "+method;
  const pre=document.createElement("pre");
  const cmd=params&&(params.command||params.commandLine);
  pre.textContent=cmd?("$ "+(Array.isArray(cmd)?cmd.join(" "):cmd)+
      (params.reason?("\n\n"+params.reason):""))
    :JSON.stringify(params,null,1).slice(0,1600);
  d.append(t,pre);

  const kind=UIContracts.serverRequests[method];
  const v=UIContracts.approvalVocab(method);
  const settle=async(label,payload)=>{
    d.querySelectorAll("button").forEach(b=>b.disabled=true);
    try{ await respond(id,payload); retireApproval(id,label); }
    catch(e){ d.querySelectorAll("button").forEach(b=>b.disabled=false); promptError(d,e); }
  };

  if(v){
    const mk=(txt,cls,val)=>{
      const b=document.createElement("button"); b.textContent=txt;
      if(cls) b.className=cls;
      b.onclick=()=>settle(txt.toLowerCase(),{decision:val});
      d.append(b);
    };
    mk("Approve","yes",v.yes);
    mk("Always",null,v.always);
    mk("Deny","no",v.no);
  } else if(kind==="permissions"){
    // grant exactly what was asked for, scoped to this turn
    const b=document.createElement("button"); b.className="yes"; b.textContent="Grant";
    b.onclick=()=>settle("granted",UIContracts.permissionResponse(params,true));
    const n=document.createElement("button"); n.className="no"; n.textContent="Deny";
    n.onclick=()=>settle("denied",UIContracts.permissionResponse(params,false));
    d.append(b,n);
  } else if(kind==="userInput"){
    pre.remove();
    for(const q of (params.questions||[])) questionField(d,q);
    const b=document.createElement("button"); b.className="yes"; b.textContent="Submit";
    b.onclick=()=>{ try{ settle("answered",UIContracts.userInputResponse(collectQuestions(d))); }
                     catch(e){ promptError(d,e); } };
    d.append(b);
  } else if(kind==="elicitation"){
    pre.textContent=params.message||`Request from ${params.serverName||"MCP server"}`;
    const safeElicitationUrl=params.mode!=="url"||/^https?:\/\//i.test(params.url||"");
    if(params.mode==="form"){
      const schema=params.requestedSchema||{}, required=new Set(schema.required||[]);
      for(const [name,field] of Object.entries(schema.properties||{}))
        elicitationField(d,name,field,required.has(name));
    } else if(params.mode==="openai/form"){
      const wrap=document.createElement("div"); wrap.className="q";
      const label=document.createElement("label"); label.textContent="Response (JSON)";
      const input=document.createElement("textarea"); input.dataset.answer="elicitation-json";
      input.value="{}"; wrap.append(label,input); d.append(wrap);
    } else if(params.mode==="url"&&safeElicitationUrl){
      const link=document.createElement("a"); link.href=params.url; link.target="_blank";
      link.rel="noreferrer"; link.textContent=params.url; d.append(link);
    } else if(params.mode==="url"){
      promptError(d,"MCP elicitation URL must use http or https");
    }
    const accept=document.createElement("button"); accept.className="yes"; accept.textContent="Accept";
    accept.disabled=!safeElicitationUrl;
    accept.onclick=()=>{ try{ settle("accepted",UIContracts.elicitationResponse(
      "accept",params.mode==="url"?undefined:collectElicitation(d))); }catch(e){ promptError(d,e); } };
    const decline=document.createElement("button"); decline.className="no"; decline.textContent="Decline";
    decline.onclick=()=>settle("declined",UIContracts.elicitationResponse("decline"));
    const cancel=document.createElement("button"); cancel.textContent="Cancel";
    cancel.onclick=()=>settle("cancelled",UIContracts.elicitationResponse("cancel"));
    d.append(accept,decline,cancel);
  } else {
    promptError(d,`Unsupported server request: ${method}`);
  }
  // Keep this outside the replaceable history window. Otherwise switching
  // threads can destroy the element while the app-server is still waiting for
  // an answer -- an approval that can never be given, and a turn stuck forever.
  // The approval tray sits above the transcript and changes its viewport
  // height. Preserve tail-follow when the reader was following, but never let
  // a new prompt yank somebody who deliberately scrolled up.
  UIContracts.mutatePreservingTail(logEl,()=>
    ($("#approvals")||logEl).append(d));
}

/* ---------- reconcile ----------
   The view is built from live SSE events plus a one-shot render on thread open.
   Anything that arrives while the thread is closed, during a reload, or in a
   dropped event is never shown -- messages silently go missing. Before trusting
   the view, compare what the server holds against what we have rendered, and
   re-render if the server is ahead. */
let reconciling=false;
async function reconcile(){
  if(!cur || reconciling) return;
  // Do not replace the item-id map while a turn is streaming. Completion and
  // the idle poll reconcile against the rollout safely.
  if(busy) return;
  reconciling=true;
  try{
    let url="/transcript?id="+encodeURIComponent(cur);
    if(transcriptRevision) url+="&revision="+encodeURIComponent(transcriptRevision);
    const probe=await (await fetch(url)).json();
    if(probe.unchanged) return;
    // A changed revision can be an append or a journal replacement. Fetch an
    // authoritative tail page. If the reader is looking at an older page, do
    // not yank the viewport; its later boundary will load the new tail when
    // requested. At the tail, replace atomically so dropped SSE is repaired.
    const atEnd=!hasLaterHistory()&&
      logEl.scrollHeight-logEl.scrollTop-logEl.clientHeight<80;
    if(!atEnd){ transcriptRevision=probe.revision||transcriptRevision; return; }
    const page=await (await fetch("/transcript?id="+encodeURIComponent(cur))).json();
    installTranscriptPage(page,{direction:"reset"});
  }catch(e){}
  finally{ reconciling=false; }
}

/* ---------- events ---------- */
const es=new EventSource("/events");
es.onopen=()=>$("#dot").classList.add("on");
es.onerror=()=>$("#dot").classList.remove("on");
async function handleServerRequest(m){
  const method=m.method, kind=UIContracts.serverRequests[method];
  if(kind==="currentTime"){
    try{ await respond(m.id,UIContracts.currentTimeResponse()); }
    catch(e){ add("err",method,String(e)); }
    return;
  }
  if(kind==="unsupported"){
    const error=UIContracts.unsupportedRequestError(method);
    try{ await respond(m.id,undefined,error); }
    catch(e){ add("err",method,String(e)); return; }
    add("err",method,error.message);
    return;
  }
  if(kind){ approval(m.id,method,m.params||{}); return; }
  const error=UIContracts.unsupportedRequestError(method||"unknown server request");
  try{ await respond(m.id,undefined,error); }catch(e){}
  add("err","server request",error.message);
}
es.onmessage=async ev=>{
  let m; try{ m=JSON.parse(ev.data); }catch{ return; }
  const meth=m.method, p=m.params||{};

  if(meth==="bridge/reload"){ await window.prepareReload(); location.reload(); return; }
  if(meth==="bridge/wire"){ wire(p.dir,p.rpc,p.id,p.payload,p.err); return; }
  if(meth==="bridge/disconnected"){
    $("#dot").classList.remove("on");
    add("err","bridge","app-server disconnected: "+(p.error||"")); return;
  }
  // Every advertised server -> client request is either answered immediately
  // or rendered as an interactive prompt. Unknown additions get an explicit
  // JSON-RPC error instead of leaving the app-server waiting forever.
  if(m.id!==undefined&&!("result"in m)&&!("error"in m)){
    await handleServerRequest(m); return;
  }
  // Resolution and turn lifecycle apply to the global approval tray, not only
  // to the thread currently rendered in the transcript pane. Handle them
  // before the agent/current-thread filters can discard the notification.
  if(meth==="serverRequest/resolved"){
    retireApproval(p.requestId,"resolved"); return;
  }
  if(meth==="turn/completed"||meth==="turn/failed"){
    expireApprovals(p.threadId,(p.turn&&p.turn.id)||p.turnId);
  }
  // events belonging to the sub-agent shown in the side pane
  if(p.threadId&&agentCur&&p.threadId===agentCur){
    if(meth==="item/agentMessage/delta"){
      aAppendDelta(p.itemId,p.delta??p.text??"");
    } else if(meth==="item/started"){
      aRenderItem(p.item||{},{reserve:true});
    } else if(meth==="item/completed"){
      aRenderItem(p.item||{},{preserve:true});
    }
    return;
  }
  const threadScoped=/^(turn\/|item\/|thread\/)/.test(meth||"");
  const threadRoute=UIContracts.threadEventRoute({eventThreadId:p.threadId,
    currentThreadId:cur,viewReady:threadViewReady});
  // Current protocol schemas require threadId on turn/item notifications. If
  // a stale server omits it during reload, never paint that event into the
  // unbound "No thread" pane; the rollout reconciliation remains canonical.
  if((threadScoped&&!p.threadId)||threadRoute==="not-ready"||threadRoute==="other"){
    if(/^(turn\/(completed|failed|started)|thread\/(status|project|queue|closed|archived|unarchived|deleted))/.test(meth||""))
      loadThreads();
    return;
  }

  if(meth==="turn/started"){
    setBusy(true);
    curTurn=(p.turn&&p.turn.id)||p.turnId||curTurn;
    if(cur) refreshMetaAfterTurnStart(cur);
  }
  else if(meth==="turn/completed"||meth==="turn/failed"){
    setBusy(false); // any command still labelled inProgress will never be completed now
    for(const el of logEl.querySelectorAll(".msg.cmd .who span")){
      if(/inProgress/i.test(el.textContent)){
        el.textContent=el.textContent.replace(/inProgress/i,
          meth==="turn/failed"?"failed":"ended");
      }
    }
    curTurn=null; loadThreads();
    if(cur){ loadMeta(cur); loadAgents(); setTimeout(()=>reconcile(),1200); }
    const turn=p.turn||{};
    if(meth==="turn/failed"||turn.status==="failed"||turn.error||p.error){
      showApiError("API error",turn.error||p.error||p,
        {threadId:p.threadId,turnId:turn.id||p.turnId});
    }
  }
  else if(meth==="item/agentMessage/delta"){
    appendItemDelta(p.itemId,{delta:p.delta??p.text??""});
  }
  else if(/reasoning.*delta/i.test(meth||"")){
    appendItemDelta(p.itemId,{cls:"rsn",who:"thinking",
      delta:p.delta??p.text??""});
  }
  else if(meth==="item/started"){
    // Reserve protocol order immediately, but keep genuinely empty items
    // invisible until a delta or completion gives them content.
    if(!/^user/i.test(String((p.item||{}).type||"")))
      renderItem(p.item,p.startedAtMs,{reserve:true});
  }
  else if(meth==="item/completed"){
    const it=p.item||{}; const ty=String(it.type||"");
    if(/subAgent|collabAgent/i.test(ty)) loadAgents();
    if(/^user/i.test(ty)){
      // A local send was rendered optimistically; an instruction injected by
      // Claude or another bridge client was not. Suppress only the matching
      // local echo, otherwise display the protocol event immediately.
      if(!consumeOptimisticUser(p.threadId,it)) renderItem(it);
      return;
    }
    // A few protocol versions complete streamed prose with an empty content
    // array. Preserve the itemId-keyed deltas in that case; a non-empty
    // completion remains authoritative.
    renderItem(it,p.completedAtMs,{preserve:true});
  }
  else if(/^thread\/(started|created|archived|unarchived|deleted|closed|status\/changed|name|queue\/changed)/.test(meth||"")){
    if(meth==="thread/closed") setBusy(false);
    loadThreads();
  }
  else if(meth==="thread/reverted"||meth==="thread/compacted"){
    loadThreads();
    if(cur) setTimeout(()=>reconcile(),100);
  }
  else if(meth==="thread/settings/updated"||meth==="thread/tokenUsage/updated"){
    if(meth==="thread/settings/updated"&&p.threadId&&p.threadSettings){
      if(p.threadSettings.cwd){
        cwdCache[p.threadId]=p.threadSettings.cwd;
        const thread=threads.find(t=>t.id===p.threadId); if(thread) thread.cwd=p.threadSettings.cwd;
        if(cur===p.threadId){ curInfo.cwd=p.threadSettings.cwd; showCwd(p.threadSettings.cwd); }
      }
      if(p.threadSettings.approvalsReviewer)
        reviewerCache[p.threadId]=p.threadSettings.approvalsReviewer;
      if(cur===p.threadId) renderedMetaFingerprint="";
    }
    if(cur) loadMeta(cur);
  }
  else if(meth==="thread/project/updated"||meth==="project/changed"){
    loadThreads(); // loadThreads refreshes the project registry first
  }
  else if(meth==="model/rerouted"){
    if(cur) loadMeta(cur);
    add("tool","model rerouted",JSON.stringify(p).slice(0,500));
  }
  else if(/subAgent|spawn|collabAgent/i.test(meth||"")){ loadAgents(); }
  else if(meth==="error"){
    showApiError(p.willRetry?"error · retrying":"error",p.error||p,
      {threadId:p.threadId,turnId:p.turnId});
  }
  else if(meth==="thread/realtime/error"){
    showApiError("realtime error",p.message||p.error||p,
      {threadId:p.threadId,turnId:p.turnId});
  }
  else if(meth==="warning"||meth==="guardianWarning"){
    add("err","warning",p.message||JSON.stringify(p).slice(0,800));
  }
  else if(meth==="configWarning"||meth==="deprecationNotice"){
    add("err",meth==="configWarning"?"configuration warning":"deprecation",
        [p.summary,p.details,p.path].filter(Boolean).join("\n"));
  }
  else if(meth==="account/rateLimits/updated"){
    // Read back the canonical aggregate. The notification omits reset credits
    // and has drifted from the read response before; one renderer avoids two
    // contradictory usage panels.
    loadUsage();
  }
};

/* ---------- boot ---------- */
(async()=>{
  const r=await rpc("model/list",{});
  models=((r.result||{}).data)||[];
  const opts=models.filter(m=>!m.hidden)
    .map(m=>`<option value="${m.id}" title="${(m.description||"").replace(/"/g,"")}">${m.displayName||m.id}</option>`).join("");
  $("#mModel").innerHTML=`<option value="">default</option>`+opts;
  $("#selModel").innerHTML=`<option value="">model: default</option>`+opts;
  // Until a thread is opened there is no effective default to display. Do not
  // mislabel inheritance with whichever model happens to be first in the
  // catalog (currently a low-effort model).
  effortOptions("", "#selEffort", true, "");
  effortOptions("", "#mEffort", false, "");
  tierOptions("");
  const restoreThread=rememberedThreadId();
  await loadThreads();
  if(restoreThread) await open_(restoreThread);
  else threadViewReady=true;
  loadAgents();
  loadUsage();
  setInterval(()=>{ if(!document.hidden) loadUsage(); },120000);
  setInterval(()=>{ if(!document.hidden) loadThreads(); },2000);
  setInterval(()=>{ if(!document.hidden&&(cur||tab==="agents")) loadAgents(); },10000);
  setInterval(()=>{ reconcile(); },6000);  // backfill anything never displayed
                                                   // even while backgrounded
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){
    loadThreads(); loadUsage(); if(cur){ loadMeta(cur); reconcile(); } } });
})();
</script>
